<!DOCTYPE html>
<html lang="pt-BR" class="bg-[#141414]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricoflix</title>
    
    <!-- Garante fundo escuro imediato para eliminar a tela branca do Discord -->
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            background-color: #141414 !important;
            color: #e5e5e5 !important;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>

    <!-- Tailwind CSS v3 (Versão estável compatível com iframes) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#141414] text-zinc-100 min-h-screen flex flex-col selection:bg-red-600 selection:text-white">

    <!-- CABEÇALHO / NAVBAR -->
    <header class="w-full bg-gradient-to-b from-black/80 to-transparent py-4 px-6 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-8">
            <h1 class="text-red-600 font-extrabold text-2xl tracking-wider cursor-pointer">RICOFLIX</h1>
            <nav class="hidden md:flex items-center gap-5 text-sm font-medium text-zinc-300">
                <a href="#" class="hover:text-white transition">Início</a>
                <a href="#" class="hover:text-white transition">Filmes</a>
                <a href="#" class="hover:text-white transition">Séries</a>
                <a href="#" class="hover:text-white transition">Minha Lista</a>
            </nav>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-grow px-6 py-4 flex flex-col gap-8 max-w-7xl mx-auto w-full">
        
        <!-- DESTAQUE -->
        <section class="flex flex-col gap-3">
            <h2 class="text-xs uppercase tracking-widest text-zinc-400 font-semibold">Destaque do Ricoflix</h2>
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 flex flex-col md:flex-row items-center justify-between gap-6 shadow-2xl">
                <div class="space-y-2 text-center md:text-left">
                    <h3 class="text-2xl font-bold text-white">Carregando conteúdo...</h3>
                    <p class="text-sm text-zinc-400 max-w-xl">Aproveite seus filmes e séries favoritos direto em sincronia com os amigos no canal de voz.</p>
                </div>
                <div class="flex items-center gap-3">
                    <button class="bg-white text-black font-semibold px-6 py-2.5 rounded hover:bg-zinc-200 transition flex items-center gap-2 shadow">
                        ▶ Assistir
                    </button>
                    <button class="bg-zinc-800/80 text-white font-semibold px-6 py-2.5 rounded hover:bg-zinc-700 transition border border-zinc-700">
                        ℹ Mais Informações
                    </button>
                </div>
            </div>
        </section>

        <!-- RESULTADOS / GRADE -->
        <section class="flex flex-col gap-4">
            <h2 class="text-lg font-semibold text-white">Resultados</h2>
            <div class="flex justify-start">
                <a href="#" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-sm px-4 py-2 rounded transition border border-zinc-700">
                    ← Voltar para o Início
                </a>
            </div>
        </section>

    </main>

    <!-- RODAPÉ -->
    <footer class="w-full py-6 text-center text-xs text-zinc-500 border-t border-zinc-900 mt-auto">
        Ricoflix &copy; Todos os direitos reservados.
    </footer>

</body>
</html>
