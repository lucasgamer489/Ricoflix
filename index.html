<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricoflix - Moderno</title>
    <style>
        /* ===== RESET E FONTE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-image: radial-gradient(circle at 50% -20%, #1c2a3a 0%, #0a0a0a 50%);
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #00e5ff, #00bcd4, #0097a7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== CATÁLOGO ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 50px;
        }

        .filtros {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }

        .filtro-btn {
            background: transparent;
            border: none;
            color: #888;
            font-size: 18px;
            font-weight: 600;
            padding: 10px 20px;
            cursor: pointer;
            position: relative;
            transition: 0.3s;
        }

        .filtro-btn:hover { color: #fff; }

        .filtro-btn.active {
            color: #00e5ff;
        }

        .filtro-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #00e5ff;
            border-radius: 3px;
        }

        /* ===== CARDS MODERNOS ===== */
        .grid-catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
        }

        .card {
            position: relative;
            background: #141414;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 40px rgba(0, 229, 255, 0.15);
        }

        .card-img-wrapper {
            width: 100%;
            height: 320px;
            position: relative;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.1);
        }

        /* Overlay de gradiente no card */
        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10, 10, 10, 1) 0%, rgba(10, 10, 10, 0.4) 50%, transparent 100%);
        }

        .card-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            z-index: 2;
        }

        .card-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #aaa;
            font-size: 14px;
        }

        .card-badge {
            background: rgba(0, 229, 255, 0.2);
            color: #00e5ff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }

        /* ===== SÉRIE E PLAYER ===== */
        .serie-area, .player-area { 
            display: none; 
            padding: 40px 50px; 
            max-width: 1400px; 
            margin: 0 auto; 
        }

        .voltar-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 30px;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        .voltar-btn:hover { background: #00e5ff; color: #000; border-color: #00e5ff; }

        .player-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: black;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .player-box video { width: 100%; height: 100%; }

        .temp-buttons { display: flex; gap: 10px; margin-bottom: 30px; }
        .temp-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .temp-btn.active { background: #00e5ff; color: #000; }

        .grid-episodios { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .ep-card { background: #1a1a1a; border-radius: 12px; padding: 20px; cursor: pointer; transition: 0.3s; border: 1px solid transparent; }
        .ep-card:hover { border-color: #00e5ff; background: #222; }
        .ep-num { color: #00e5ff; font-weight: bold; margin-bottom: 10px; }
        .ep-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .ep-desc { font-size: 14px; color: #888; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Ricoflix</div>
    </header>

    <div class="container" id="tela-catalogo">
        <div class="filtros">
            <button class="filtro-btn active" onclick="filtrar('tudo')">Tudo</button>
            <button class="filtro-btn" onclick="filtrar('filme')">Filmes</button>
            <button class="filtro-btn" onclick="filtrar('serie')">Séries</button>
        </div>
        <div class="grid-catalogo" id="grid-catalogo"></div>
    </div>

    <div id="tela-serie" class="serie-area">
        <button class="voltar-btn" onclick="voltarCatalogo()">← Voltar ao Catálogo</button>
        <h1 id="titulo-serie" style="margin-bottom: 30px; font-size: 40px; font-weight: 900;"></h1>
        <div class="temp-buttons" id="botoes-temporada"></div>
        <div class="grid-episodios" id="lista-episodios"></div>
    </div>

    <div id="tela-player" class="player-area">
        <button class="voltar-btn" onclick="voltarCatalogo()">← Voltar</button>
        <div class="player-box" id="player-box">
            <p style="color:#555; text-align:center; padding-top: 200px;">Carregando...</p>
        </div>
    </div>

    <script>
        // ================= DADOS COM CAPAS REAIS =================
        // Para as capas nunca mais quebrarem, o ideal é você baixar as imagens e colocar na pasta do projeto.
        // Mas para garantir que funcione agora, usei uma lógica: se a imagem do Google quebrar, ele puxa uma capa gerada automaticamente.
        
        const filmes = [
            { id: 'filme1', titulo: 'Sonic 3', ano: 2024, tipo: 'filme', 
              img: 'https://image.tmdb.org/t/p/w500/d8Ryb8AunYAuyc35NRxaZ4zM7kI.jpg', 
              video: 'https://drive.google.com/uc?export=download&id=1f0Dtk0OiaziKH7QPftkP3jEuI2lU7x3Q' },
            
            { id: 'filme2', titulo: 'Deadpool 3', ano: 2024, tipo: 'filme', 
              img: 'https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg', 
              video: 'https://drive.google.com/uc?export=download&id=SEU_ID_DEADPOOL_AQUI' },
            
            { id: 'serie1', titulo: 'O Incrível Mundo de Gumball', ano: 2011, tipo: 'serie', 
              img: 'https://image.tmdb.org/t/p/w500/u9x4eTYnCehW4zW5Rq4KpD8qL6U.jpg' }
        ];

        const seriesData = {
            'serie1': {
                nome: 'O Incrível Mundo de Gumball',
                temporadas: {
                    1: [
                        { num: 1, titulo: 'O Fantasma', desc: 'Gumball prova que a escola é assombrada.', video: 'https://drive.google.com/uc?export=download&id=SEU_ID_EP1_AQUI' },
                        { num: 2, titulo: 'A Calculadora', desc: 'Darwin tenta ser esperto.', video: 'https://drive.google.com/uc?export=download&id=SEU_ID_EP2_AQUI' }
                    ]
                }
            }
        };

        // ================= LÓGICA =================

        // Função para gerar capa colorida se a imagem quebrar (nunca mais fica preto!)
        function gerarCapaFallback(titulo) {
            return `https://placehold.co/400x600/1a1a1a/00e5ff?text=${encodeURIComponent(titulo)}`;
        }

        function renderizarCatalogo() {
            const grid = document.getElementById('grid-catalogo');
            grid.innerHTML = '';
            filmes.forEach(item => {
                grid.innerHTML += `<div class="card" onclick="abrirItem('${item.id}')">
                    <div class="card-img-wrapper">
                        <img src="${item.img}" onerror="this.src='${gerarCapaFallback(item.titulo)}'">
                        <div class="card-overlay"></div>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${item.titulo}</div>
                        <div class="card-meta">
                            <span>${item.ano}</span>
                            <span class="card-badge">${item.tipo === 'filme' ? 'FILME' : 'SÉRIE'}</span>
                        </div>
                    </div>
                </div>`;
            });
        }

        function filtrar(tipo) {
            document.querySelectorAll('.filtro-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const grid = document.getElementById('grid-catalogo');
            grid.innerHTML = '';
            const listaFiltrada = tipo === 'tudo' ? filmes : filmes.filter(f => f.tipo === tipo);
            
            listaFiltrada.forEach(item => {
                grid.innerHTML += `<div class="card" onclick="abrirItem('${item.id}')">
                    <div class="card-img-wrapper">
                        <img src="${item.img}" onerror="this.src='${gerarCapaFallback(item.titulo)}'">
                        <div class="card-overlay"></div>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${item.titulo}</div>
                        <div class="card-meta">
                            <span>${item.ano}</span>
                            <span class="card-badge">${item.tipo === 'filme' ? 'FILME' : 'SÉRIE'}</span>
                        </div>
                    </div>
                </div>`;
            });
        }

        function abrirItem(id) {
            const item = filmes.find(f => f.id === id);
            if (item.tipo === 'filme') abrirPlayer(item.video);
            else abrirSerie(id);
        }

        function abrirPlayer(linkVideo) {
            document.getElementById('tela-catalogo').style.display = 'none';
            document.getElementById('tela-serie').style.display = 'none';
            document.getElementById('tela-player').style.display = 'block';

            document.getElementById('player-box').innerHTML = `
                <video controls autoplay>
                    <source src="${linkVideo}" type="video/mp4">
                </video>
            `;
        }

        function abrirSerie(id) {
            document.getElementById('tela-catalogo').style.display = 'none';
            document.getElementById('tela-player').style.display = 'none';
            const serie = seriesData[id];
            document.getElementById('titulo-serie').innerText = serie.nome;
            
            const botoesTemp = document.getElementById('botoes-temporada');
            botoesTemp.innerHTML = '';
            Object.keys(serie.temporadas).forEach(temp => {
                botoesTemp.innerHTML += `<button class="temp-btn" onclick="mudarTemporada('${id}', ${temp}, this)">Temporada ${temp}</button>`;
            });

            document.getElementById('tela-serie').style.display = 'block';
            mudarTemporada(id, 1, botoesTemp.firstChild);
        }

        function mudarTemporada(idSerie, numTemp, btnClicado) {
            document.querySelectorAll('.temp-btn').forEach(b => b.classList.remove('active'));
            btnClicado.classList.add('active');

            const eps = seriesData[idSerie].temporadas[numTemp];
            const lista = document.getElementById('lista-episodios');
            lista.innerHTML = '';

            eps.forEach(ep => {
                lista.innerHTML += `<div class="ep-card" onclick="abrirPlayer('${ep.video}')">
                    <div class="ep-num">Episódio ${ep.num}</div>
                    <div class="ep-title">${ep.titulo}</div>
                    <div class="ep-desc">${ep.desc}</div>
                </div>`;
            });
        }

        function voltarCatalogo() {
            document.getElementById('player-box').innerHTML = '<p style="color:#555; text-align:center; padding-top: 200px;">Carregando...</p>';
            document.getElementById('tela-serie').style.display = 'none';
            document.getElementById('tela-player').style.display = 'none';
            document.getElementById('tela-catalogo').style.display = 'block';
            renderizarCatalogo();
        }

        window.onload = renderizarCatalogo;
    </script>
</body>
</html>
