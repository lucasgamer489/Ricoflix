<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricoflix</title>
    <style>
        :root {
            --bg-color: #141414;
            --primary-red: #E50914;
            --text-color: #FFFFFF;
            --gray-text: #b3b3b3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* Navbar estilo Netflix */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 50px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 10%, rgba(0,0,0,0));
            z-index: 100;
        }

        .logo {
            color: var(--primary-red);
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--gray-text);
        }

        /* Banner Principal (Hero) */
        .hero {
            height: 80vh;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 50px;
            box-shadow: inset 0 -100px 100px -50px var(--bg-color);
        }

        .hero-content {
            max-width: 600px;
            z-index: 2;
        }

        .hero-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .hero-description {
            font-size: 16px;
            line-height: 1.4;
            margin-bottom: 25px;
            color: #ddd;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 25px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: opacity 0.3s;
        }

        .btn-primary {
            background-color: white;
            color: black;
        }

        .btn-secondary {
            background-color: rgba(109, 109, 110, 0.7);
            color: white;
        }

        .btn:hover {
            opacity: 0.85;
        }

        /* Modal do Player */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 85%;
            height: 85%;
            position: relative;
            background: black;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: #141414;
            color: white;
            border: none;
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1010;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .close-btn:hover {
            background: var(--primary-red);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">RICOFLIX</div>
        <ul class="nav-links">
            <li><a href="#">Início</a></li>
            <li><a href="#">Filmes</a></li>
            <li><a href="#">Séries</a></li>
            <li><a href="#">Minha Lista</a></li>
        </ul>
    </nav>

    <!-- Banner Principal (Exemplo: Corrida Contra o Tempo / ID TMDB 19995 como base) -->
    <section class="hero" style="background-image: url('https://image.tmdb.org/t/p/original/suopoADq0k8YZr4dQXcU6pToj6s.jpg');">
        <div class="hero-content">
            <h1 class="hero-title">Corrida Contra o Tempo</h1>
            <p class="hero-description">Maia Marten é uma advogada brilhante de Londres, vê a sua vida ruir com uma ligação durante sua corrida matinal que avisa que seu filho foi sequestrado...</p>
            <div class="hero-buttons">
                <!-- Botão que abre o player usando a RedeflixAPI -->
                <button class="btn btn-primary" onclick="abrirPlayer('filme', '19995')">
                    ▶ Assistir
                </button>
                <button class="btn btn-secondary">
                    ℹ Mais Informações
                </button>
            </div>
        </div>
    </section>

    <!-- Modal de Reprodução com o Player da Nova API -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <button class="close-btn" onclick="fecharPlayer()">✕</button>
            <iframe id="videoIframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function abrirPlayer(tipo, id, temporada = 1, episodio = 1) {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('videoIframe');
            
            let url = '';
            
            // Monta a rota exatamente como a documentação da RedeflixAPI exige
            if (tipo === 'filme') {
                url = `https://redeflixapi.store/filme/${id}`;
            } else if (tipo === 'serie') {
                url = `https://redeflixapi.store/serie/${id}/${temporada}/${episodio}`;
            }

            iframe.src = url;
            modal.style.display = 'flex';
        }

        function fecharPlayer() {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('videoIframe');
            
            iframe.src = ''; // Para o vídeo ao fechar o modal
            modal.style.display = 'none';
        }
    </script>

</body>
</html>
