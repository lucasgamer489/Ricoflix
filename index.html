<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ricoflix — Dublado PT-BR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }
        body {
            background: #0a0a0a;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .card {
            width: 200px;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s;
            cursor: pointer;
            flex-shrink: 0;
        }
        .card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: #00E5FF;
        }
        .card .poster-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            background: #0a0a0a;
            overflow: hidden;
        }
        .card .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card .info {
            padding: 0.9rem;
        }
        .card .info h3 {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #eef4ff;
        }
        .card .info .year {
            font-size: 0.75rem;
            color: #6688aa;
        }
        .card .badge-type {
            font-size: 0.6rem;
            background: rgba(0, 229, 255, 0.06);
            border: 1px solid rgba(0, 229, 255, 0.08);
            padding: 0.15rem 0.7rem;
            border-radius: 40px;
            color: #88ccff;
        }

        .scroll {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 1.2rem;
            padding: 0.8rem 0.2rem 2rem 0.2rem;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .scroll>* {
            flex: 0 0 auto;
            scroll-snap-align: start;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: #00E5FF;
            letter-spacing: -0.5px;
        }

        .btn {
            background: rgba(0, 229, 255, 0.04);
            border: 1px solid rgba(0, 229, 255, 0.12);
            color: #00E5FF;
            padding: 0.5rem 1.4rem;
            border-radius: 60px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn:hover {
            background: rgba(0, 229, 255, 0.08);
            border-color: #00E5FF;
        }

        .search {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 229, 255, 0.12);
            border-radius: 60px;
            padding: 0.5rem 1.2rem 0.5rem 2.8rem;
            color: #f0f0f0;
            width: 260px;
            transition: all 0.3s;
        }
        .search:focus {
            outline: none;
            border-color: #00E5FF;
        }
        .search::placeholder {
            color: #556677;
        }

        .tab {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            color: #8899aa;
            transition: all 0.25s;
            cursor: pointer;
        }
        .tab.active {
            background: rgba(0, 229, 255, 0.06);
            border-color: #00E5FF;
            color: #00E5FF;
        }

        .loader {
            border: 2px solid rgba(0, 229, 255, 0.05);
            border-top: 2px solid #00E5FF;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.9s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        #player-container {
            background: #0a0a0a;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(0, 229, 255, 0.06);
            min-height: 420px;
        }
        #player-container video {
            width: 100%;
            height: 420px;
            background: #000;
            display: block;
        }
        #player-container .plyr {
            border-radius: 24px;
            background: #000;
            width: 100%;
        }
        #player-container .plyr__controls {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0, 229, 255, 0.05);
        }
        .plyr__control--overlaid {
            background: rgba(0, 229, 255, 0.15) !important;
            border: 2px solid rgba(0, 229, 255, 0.3) !important;
        }
        .plyr__control--overlaid svg {
            fill: #00E5FF !important;
        }

        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 3rem;
            text-align: center;
            color: #445566;
        }
        .placeholder .icon {
            font-size: 3rem;
            color: #00E5FF;
            margin-bottom: 1rem;
        }
        .placeholder .title {
            color: #eef4ff;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .player-title {
            color: #aabbdd;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .player-title strong {
            color: #00E5FF;
            font-weight: 600;
        }

        @media (max-width: 640px) {
            .card {
                width: 160px;
            }
            .card .poster-wrapper {
                height: 220px;
            }
            .search {
                width: 180px;
            }
            #player-container video {
                height: 280px;
            }
        }
    </style>
</head>
<body class="antialiased p-4 md:p-6 max-w-7xl mx-auto" x-data="app()" x-init="init()">

    <header class="flex flex-wrap items-center justify-between gap-4 mb-6">
        <div class="flex items-center gap-3">
            <span class="logo">Ricoflix</span>
            <span class="hidden sm:inline text-[10px] text-[#445566] bg-black/60 px-3 py-1 rounded-full border border-[#00E5FF]/10">
                Dublado
            </span>
        </div>
        <div class="flex items-center gap-3 flex-wrap">
            <div class="relative">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:#445566;">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="searchInput" placeholder="Buscar filmes..." class="search pl-10 pr-4 py-2" x-model="searchQuery" @keyup.enter="performSearch()" />
            </div>
            <button class="btn" @click="performSearch()">Ir</button>
        </div>
    </header>

    <div class="flex flex-wrap items-center gap-3 mb-6 border-b border-[#00E5FF]/5 pb-3">
        <span class="tab" :class="{ active: currentFilter === 'all' }" @click="setFilter('all')">Tudo</span>
        <span class="tab" :class="{ active: currentFilter === 'movie' }" @click="setFilter('movie')">Filmes</span>
        <span class="tab" :class="{ active: currentFilter === 'tv' }" @click="setFilter('tv')">Séries</span>
        <span class="ml-auto text-[10px] text-[#445566]">
            Dublado PT-BR
        </span>
    </div>

    <section class="mb-6">
        <div class="scroll" id="movieGrid">
            <template x-for="movie in filteredMovies" :key="movie.id">
                <div class="card" @click="loadMovie(movie)">
                    <div class="poster-wrapper">
                        <img :src="movie.poster" :alt="movie.title" loading="lazy" />
                        <div style="position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.8);padding:0.2rem 0.6rem;border-radius:40px;border:1px solid rgba(0,229,255,0.2);">
                            <span style="font-size:0.5rem;color:#00E5FF;">DUB</span>
                        </div>
                    </div>
                    <div class="info">
                        <div class="flex justify-between items-start">
                            <h3 x-text="movie.title"></h3>
                        </div>
                        <div class="flex justify-between items-center mt-1">
                            <span class="year" x-text="movie.year"></span>
                            <span class="badge-type" x-text="movie.type === 'tv' ? 'Série' : 'Filme'"></span>
                        </div>
                    </div>
                </div>
            </template>
        </div>
        <div id="loaderGrid" class="flex justify-center py-8" x-show="loading">
            <div class="loader"></div>
        </div>
        <p class="text-center text-[#445566] py-6 hidden" id="noResults">Nenhum título encontrado.</p>
    </section>

    <section id="player-section" class="mt-6">
        <div id="player-container">
            <div class="placeholder" id="fallbackMessage" x-show="!currentMovie">
                <div class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#00E5FF;">
                        <rect x="2" y="2" width="20" height="20" rx="2.18" />
                        <line x1="8" y1="2" x2="8" y2="22" />
                        <line x1="16" y1="2" x2="16" y2="22" />
                        <line x1="2" y1="8" x2="22" y2="8" />
                        <line x1="2" y1="16" x2="22" y2="16" />
                    </svg>
                </div>
                <div class="title">Selecione um filme</div>
                <div class="sub" style="color:#445566;margin-top:0.5rem;">Clique em um card para assistir sem anúncios</div>
            </div>
            <video id="player" playsinline controls style="display:none;"></video>
        </div>
        <div class="flex flex-wrap justify-between items-center mt-3 text-sm text-[#556677] px-1 gap-2">
            <span class="player-title" id="movieTitlePlayer">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-right:0.5rem;color:#00E5FF;">
                    <polygon points="5 3 19 12 5 21 5 3" />
                </svg>
                <strong x-text="currentMovie ? currentMovie.title : 'Selecione um filme'"></strong>
                <span class="text-[#445566] text-xs ml-2" x-show="currentMovie">Player Nativo · Dublado</span>
            </span>
        </div>
    </section>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js">
    </script>
    <script>
        function app() {
            return {
                catalog: [],
                currentFilter: 'all',
                searchQuery: '',
                currentMovie: null,
                loading: true,
                playerInstance: null,

                get filteredMovies() {
                    let filtered = [...this.catalog];
                    if (this.currentFilter === 'movie') {
                        filtered = filtered.filter(m => m.type === 'movie');
                    } else if (this.currentFilter === 'tv') {
                        filtered = filtered.filter(m => m.type === 'tv');
                    }
                    if (this.searchQuery.trim()) {
                        const q = this.searchQuery.toLowerCase();
                        filtered = filtered.filter(m => m.title.toLowerCase().includes(q));
                    }
                    return filtered;
                },

                async init() {
                    await this.loadCatalog();
                    this.initPlayer();
                },

                initPlayer() {
                    const videoElement = document.getElementById('player');
                    if (videoElement) {
                        this.playerInstance = new Plyr(videoElement, {
                            controls: [
                                'play-large', 'play', 'progress', 'current-time', 'duration',
                                'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'
                            ],
                            settings: ['quality', 'speed'],
                            quality: { default: 720, options: [1080, 720, 480, 360] },
                            i18n: { quality: 'Qualidade', speed: 'Velocidade' }
                        });
                    }
                },

                async loadCatalog() {
                    this.loading = true;
                    this.catalog = await this.fetchMovies();
                    this.loading = false;
                },

                async fetchMovies() {
                    const MOVIES = [{
                        id: 'sonic3',
                        title: 'Sonic 3',
                        year: '2024',
                        poster: 'https://image.tmdb.org/t/p/w342/d8Ryb8AunYAuycVKDp5HpdWPKgV.jpg',
                        type: 'movie',
                        video: 'https://anonmp4.art/stream/3F23Ihvy1KPOKNe.mp4'
                    }, {
                        id: 'deadpool3',
                        title: 'Deadpool 3',
                        year: '2024',
                        poster: 'https://image.tmdb.org/t/p/w342/8cdWjvZQUDoUYc5uQQj9DmxyiXJ.jpg',
                        type: 'movie',
                        video: null
                    }, {
                        id: 'divertidamente2',
                        title: 'Divertida Mente 2',
                        year: '2024',
                        poster: 'https://image.tmdb.org/t/p/w342/p6H8b1cGfEo9fKbCw8jG0s3nGxM.jpg',
                        type: 'movie',
                        video: null
                    }, {
                        id: 'oppenheimer',
                        title: 'Oppenheimer',
                        year: '2023',
                        poster: 'https://image.tmdb.org/t/p/w342/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg',
                        type: 'movie',
                        video: null
                    }, {
                        id: 'duna2',
                        title: 'Duna: Parte 2',
                        year: '2024',
                        poster: 'https://image.tmdb.org/t/p/w342/8b8R8l88Qje9dn9OE8PY05Nxl1X.jpg',
                        type: 'movie',
                        video: null
                    }, {
                        id: 'johnwick4',
                        title: 'John Wick 4',
                        year: '2023',
                        poster: 'https://image.tmdb.org/t/p/w342/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg',
                        type: 'movie',
                        video: null
                    }];

                    return MOVIES;
                },

                loadMovie(movie) {
                    this.currentMovie = movie;

                    const videoElement = document.getElementById('player');
                    const placeholder = document.getElementById('fallbackMessage');

                    if (!movie.video) {
                        placeholder.style.display = 'flex';
                        videoElement.style.display = 'none';
                        placeholder.innerHTML = `
                            <div class="icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#00E5FF;">
                                    <circle cx="12" cy="12" r="10" />
                                    <line x1="12" y1="8" x2="12" y2="12" />
                                    <line x1="12" y1="16" x2="12.01" y2="16" />
                                </svg>
                            </div>
                            <div class="title">Em breve</div>
                            <div class="sub" style="color:#445566;margin-top:0.5rem;">Este título ainda está sendo hospedado</div>
                        `;
                        return;
                    }

                    placeholder.style.display = 'none';
                    videoElement.style.display = 'block';

                    videoElement.src = movie.video;
                    videoElement.poster = movie.poster || '';
                    videoElement.load();

                    if (this.playerInstance) {
                        setTimeout(() => this.playerInstance.play(), 500);
                    }

                    document.getElementById('player-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
                },

                setFilter(filter) {
                    this.currentFilter = filter;
                    this.searchQuery = '';
                },

                performSearch() {
                    // Alpine.js já faz o filtro automaticamente via computed property
                }
            }
        }
    </script>

    <footer class="mt-12 pt-6 border-t border-[#00E5FF]/5 text-[10px] text-[#334455] flex justify-between items-center">
        <span>© 2026 Ricoflix · Dublado PT-BR</span>
        <span>Player Nativo · Sem Anúncios</span>
    </footer>
</body>
</html>
