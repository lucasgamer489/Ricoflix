<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ricoflix — Player Profissional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { background: #000000; font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif; color: #e0e0e0; min-height: 100vh; }
        
        .card-cyber { width: 200px; background: #080808; border-radius: 24px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.04); transition: all 0.3s; cursor: pointer; flex-shrink: 0; }
        .card-cyber:hover { transform: translateY(-6px) scale(1.02); border-color: #00E5FF; box-shadow: 0 0 30px rgba(0, 229, 255, 0.1); }
        .card-cyber .poster-wrapper { position: relative; width: 100%; height: 280px; background: #0a0a0a; overflow: hidden; }
        .card-cyber .poster-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-cyber .info { padding: 0.9rem; }
        .card-cyber .info h3 { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #eef4ff; }
        .card-cyber .info .year { font-size: 0.75rem; color: #6688aa; }
        .card-cyber .badge-type { font-size: 0.6rem; background: rgba(0, 229, 255, 0.06); border: 1px solid rgba(0, 229, 255, 0.08); padding: 0.15rem 0.7rem; border-radius: 40px; color: #88ccff; }
        
        .scroll-neon { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 1.2rem; padding: 0.8rem 0.2rem 2rem 0.2rem; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .scroll-neon > * { flex: 0 0 auto; scroll-snap-align: start; }
        
        .logo-glitch { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, #00E5FF 0%, #b000ff 80%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn-neon { background: rgba(0, 229, 255, 0.04); border: 1px solid rgba(0, 229, 255, 0.15); color: #00E5FF; padding: 0.5rem 1.4rem; border-radius: 60px; font-weight: 500; transition: all 0.3s; }
        .btn-neon:hover { background: rgba(0, 229, 255, 0.08); border-color: #00E5FF; }
        
        .search-cyber { background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(0, 229, 255, 0.15); border-radius: 60px; padding: 0.5rem 1.2rem 0.5rem 2.8rem; color: #f0f0f0; width: 260px; transition: all 0.3s; }
        .search-cyber:focus { outline: none; border-color: #00E5FF; }
        .search-cyber::placeholder { color: #556677; }
        
        .tab-neon { background: transparent; border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 40px; padding: 0.5rem 1.2rem; color: #8899aa; transition: all 0.25s; cursor: pointer; }
        .tab-neon.active { background: rgba(0, 229, 255, 0.08); border-color: #00E5FF; color: #00E5FF; }
        
        .loader-neon { border: 2px solid rgba(0, 229, 255, 0.05); border-top: 2px solid #00E5FF; border-radius: 50%; width: 36px; height: 36px; animation: spin 0.9s linear infinite; margin: 2rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #player-container { background: #0a0a0a; border-radius: 28px; overflow: hidden; border: 1px solid rgba(0, 229, 255, 0.08); min-height: 420px; }
        #player-container .plyr { border-radius: 28px; background: #000; }
        #player-container .plyr__controls { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); border-top: 1px solid rgba(0, 229, 255, 0.05); }
        .plyr__control--overlaid { background: rgba(0, 229, 255, 0.15) !important; border: 2px solid rgba(0, 229, 255, 0.3) !important; }
        .plyr__control--overlaid svg { fill: #00E5FF !important; }
        
        .fallback-message { display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 3rem; text-align: center; color: #445566; }
        .fallback-message i { font-size: 3rem; color: #00E5FF; margin-bottom: 1rem; }
        .fallback-message .title { color: #eef4ff; font-size: 1.2rem; font-weight: 600; }
        
        .source-selector { background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(0, 229, 255, 0.15); border-radius: 40px; padding: 0.4rem 1rem; color: #aabbdd; font-size: 0.8rem; cursor: pointer; min-width: 180px; }
        .source-selector option { background: #0a0a0a; color: #e0e0e0; }
        
        @media (max-width: 640px) { .card-cyber { width: 160px; } .card-cyber .poster-wrapper { height: 220px; } .search-cyber { width: 180px; } }
    </style>
</head>
<body class="antialiased p-4 md:p-6 max-w-7xl mx-auto">

    <header class="flex flex-wrap items-center justify-between gap-4 mb-6">
        <div class="flex items-center gap-3">
            <span class="logo-glitch">Ricoflix</span>
            <span class="hidden sm:inline text-[10px] text-[#445566] bg-black/60 px-3 py-1 rounded-full border border-[#00E5FF]/10">
                <i class="fas fa-play text-[#00E5FF] mr-1"></i> Player Pro
            </span>
        </div>
        <div class="flex items-center gap-3 flex-wrap">
            <div class="relative">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-[#445566] text-sm"></i>
                <input type="text" id="searchInput" placeholder="Buscar filmes..." class="search-cyber pl-10 pr-4 py-2" />
            </div>
            <button id="searchBtn" class="btn-neon"><i class="fas fa-arrow-right mr-1"></i> Ir</button>
        </div>
    </header>

    <div class="flex flex-wrap items-center gap-3 mb-6 border-b border-[#00E5FF]/5 pb-3">
        <span class="tab-neon active" data-filter="all">📡 Tudo</span>
        <span class="tab-neon" data-filter="movie">🎬 Filmes</span>
        <span class="tab-neon" data-filter="tv">📺 Séries</span>
        <span class="ml-auto text-[10px] text-[#445566]">
            <i class="fas fa-circle text-[#00E5FF] text-[5px] align-middle mr-1"></i> Player Profissional
        </span>
    </div>

    <section class="mb-6">
        <div id="movieGrid" class="scroll-neon"></div>
        <div id="loaderGrid" class="flex justify-center py-8">
            <div class="loader-neon"></div>
        </div>
        <p id="noResults" class="text-center text-[#445566] py-6 hidden">Nenhum título encontrado.</p>
    </section>

    <section id="player-section" class="mt-6">
        <div id="player-container">
            <div id="fallbackMessage" class="fallback-message">
                <i class="fas fa-film"></i>
                <div class="title">🎬 Selecione um filme</div>
                <div class="sub" style="color:#445566;margin-top:0.5rem;">Clique em um card para assistir com player profissional</div>
            </div>
            <video id="player" playsinline controls style="display:none;"></video>
        </div>
        <div class="flex flex-wrap justify-between items-center mt-3 text-sm text-[#556677] px-1 gap-2">
            <span id="movieTitlePlayer" class="player-title"><i class="fas fa-play-circle text-[#00E5FF] mr-2"></i> <strong>Selecione</strong> um filme</span>
            <div class="flex items-center gap-2">
                <span class="text-[10px] text-[#445566]"><i class="fas fa-plug mr-1"></i>Fonte:</span>
                <select id="sourceSelector" class="source-selector">
                    <option value="superflix">🔴 Superflix (Dublado)</option>
                    <option value="redecanais">🟠 Rede Canais</option>
                    <option value="multiembed">🟣 MultiEmbed</option>
                    <option value="embedsu">🔵 EmbedSU</option>
                </select>
            </div>
        </div>
    </section>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
    (function() {
        'use strict';

        // ================================================================
        //  CATÁLOGO
        // ================================================================
        const CATALOG = [
            { id: '939243', title: 'Sonic 3', year: '2024', poster: 'https://image.tmdb.org/t/p/w342/d8Ryb8AunYAuycVKDp5HpdWPKgV.jpg', type: 'movie' },
            { id: '533535', title: 'Deadpool 3', year: '2024', poster: 'https://image.tmdb.org/t/p/w342/8cdWjvZQUDoUYc5uQQj9DmxyiXJ.jpg', type: 'movie' },
            { id: '1022789', title: 'Divertida Mente 2', year: '2024', poster: 'https://image.tmdb.org/t/p/w342/p6H8b1cGfEo9fKbCw8jG0s3nGxM.jpg', type: 'movie' },
            { id: '872585', title: 'Oppenheimer', year: '2023', poster: 'https://image.tmdb.org/t/p/w342/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg', type: 'movie' },
            { id: '693134', title: 'Duna: Parte 2', year: '2024', poster: 'https://image.tmdb.org/t/p/w342/8b8R8l88Qje9dn9OE8PY05Nxl1X.jpg', type: 'movie' },
            { id: '603692', title: 'John Wick 4', year: '2023', poster: 'https://image.tmdb.org/t/p/w342/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg', type: 'movie' },
            { id: '245891', title: 'John Wick', year: '2014', poster: 'https://image.tmdb.org/t/p/w342/fZPSd2r4S1M6NdP5p5pK5G5mN5jM.jpg', type: 'movie' },
            { id: '324852', title: 'John Wick 2', year: '2017', poster: 'https://image.tmdb.org/t/p/w342/3bN7V5X9nK5D5kF0v5L5h5mN5jM.jpg', type: 'movie' },
            { id: '458576', title: 'John Wick 3', year: '2019', poster: 'https://image.tmdb.org/t/p/w342/5Y5WZ7Y8Z9W6X8p8A0zJ2fL.jpg', type: 'movie' },
            { id: '123456', title: 'Godzilla x Kong', year: '2024', poster: 'https://image.tmdb.org/t/p/w342/z1p34fs7E0nPkH0j3l7M0wZ9qE6.jpg', type: 'movie' },
            { id: '151667', title: 'Aranhaverso', year: '2018', poster: 'https://image.tmdb.org/t/p/w342/xD1l6vW0V8K9W6X8p8A0zJ2fL.jpg', type: 'movie' },
            { id: '234567', title: 'Furiosa', year: '2024', poster: 'https://image.tmdb.org/t/p/w342/iDdF3vF0nK5D5kF0v5L5h5mN5jM.jpg', type: 'movie' },
            { id: '100088', title: 'The Last of Us', year: '2023', poster: 'https://image.tmdb.org/t/p/w342/uKvVjHNqB5VmOrdxqAt2F7JfEDB.jpg', type: 'tv' },
            { id: '115713', title: 'The Bear', year: '2022', poster: 'https://image.tmdb.org/t/p/w342/7H8Hk2W0U8V4K9W6X8p8A0zJ2fL.jpg', type: 'tv' },
            { id: '76479', title: 'The Boys', year: '2019', poster: 'https://image.tmdb.org/t/p/w342/mC3I0eghP1g5Kb3rWxbB9qkN4sE.jpg', type: 'tv' },
            { id: '67744', title: 'Succession', year: '2018', poster: 'https://image.tmdb.org/t/p/w342/7rTllR2Tx2UMj17HwDfB9TZ67jM.jpg', type: 'tv' },
            { id: '66732', title: 'Stranger Things', year: '2016', poster: 'https://image.tmdb.org/t/p/w342/49WJfeN0E1p5R0Y2Q8yN1z3X9fA.jpg', type: 'tv' }
        ];

        // ================================================================
        //  FONTES DE VÍDEO (DUBLADOS)
        // ================================================================
        const SOURCES = {
            'superflix': {
                name: 'Superflix',
                url: (id, type, season, episode) => {
                    if (type === 'tv') {
                        return `https://superflixbr.org/assistir/${id}/${season}/${episode}`;
                    }
                    return `https://superflixbr.org/filme/${id}`;
                }
            },
            'redecanais': {
                name: 'Rede Canais',
                url: (id, type, season, episode) => {
                    if (type === 'tv') {
                        return `https://redecanais.uno/series/${id}/temporada-${season}/episodio-${episode}`;
                    }
                    return `https://redecanais.uno/filmes/${id}`;
                }
            },
            'multiembed': {
                name: 'MultiEmbed',
                url: (id, type, season, episode) => {
                    if (type === 'tv') {
                        return `https://multiembed.mov/?video_id=${id}&tmdb=1&lang=pt&season=${season}&episode=${episode}`;
                    }
                    return `https://multiembed.mov/?video_id=${id}&tmdb=1&lang=pt`;
                }
            },
            'embedsu': {
                name: 'EmbedSU',
                url: (id, type, season, episode) => {
                    if (type === 'tv') {
                        return `https://embed.su/embed/tv/${id}/${season}/${episode}`;
                    }
                    return `https://embed.su/embed/movie/${id}`;
                }
            }
        };

        // ================================================================
        //  ELEMENTOS
        // ================================================================
        const grid = document.getElementById('movieGrid');
        const loader = document.getElementById('loaderGrid');
        const noResults = document.getElementById('noResults');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const videoElement = document.getElementById('player');
        const fallbackMessage = document.getElementById('fallbackMessage');
        const movieTitlePlayer = document.getElementById('movieTitlePlayer');
        const sourceSelector = document.getElementById('sourceSelector');
        
        let plyrInstance = null;
        let currentFilter = 'all';
        let currentMovie = null;

        // ================================================================
        //  INICIALIZAR PLYR
        // ================================================================
        function initPlyr() {
            if (plyrInstance) {
                plyrInstance.destroy();
            }
            plyrInstance = new Plyr(videoElement, {
                controls: [
                    'play-large', 'play', 'progress', 'current-time', 'duration',
                    'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'
                ],
                settings: ['quality', 'speed'],
                quality: { default: 720, options: [1080, 720, 480, 360] },
                i18n: { quality: 'Qualidade', speed: 'Velocidade' }
            });
        }

        // ================================================================
        //  CARREGAR FILME - ABRE EM NOVA ABA (MAIS CONFIÁVEL)
        // ================================================================
        function loadMovie(movie) {
            currentMovie = movie;
            
            const sourceKey = sourceSelector.value;
            const source = SOURCES[sourceKey] || SOURCES['superflix'];
            
            let url;
            if (movie.type === 'tv') {
                url = source.url(movie.id, 'tv', 1, 1);
            } else {
                url = source.url(movie.id, 'movie');
            }
            
            // Abre em nova aba (mais confiável que iframe)
            window.open(url, '_blank');
            
            // Atualiza a interface
            movieTitlePlayer.innerHTML = `<i class="fas fa-external-link-alt text-[#00E5FF] mr-2"></i> <strong>${movie.title}</strong> <span class="text-[#445566] text-xs ml-2">⚡ Abrindo ${source.name} · Dublado</span>`;
            
            // Mostra mensagem no player
            fallbackMessage.style.display = 'flex';
            fallbackMessage.innerHTML = `
                <i class="fas fa-external-link-alt" style="color:#00E5FF;"></i>
                <div class="title">🎬 ${movie.title}</div>
                <div class="sub" style="color:#445566;margin-top:0.5rem;">Abrindo em nova aba com dublagem PT-BR</div>
                <div class="sub" style="color:#334455;font-size:0.7rem;margin-top:0.3rem;">
                    <i class="fas fa-check-circle text-[#00E5FF] mr-1"></i> 
                    ${source.name} · ${movie.type === 'tv' ? 'Série' : 'Filme'} Dublado
                </div>
                <a href="${url}" target="_blank" class="btn-neon" style="margin-top:1rem;display:inline-block;text-decoration:none;">
                    <i class="fas fa-play mr-2"></i> Assistir Agora
                </a>
            `;
            videoElement.style.display = 'none';
            
            document.getElementById('player-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ================================================================
        //  RENDER CARDS
        // ================================================================
        function renderMovies(movies) {
            grid.innerHTML = '';
            if (!movies || movies.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'card-cyber';
                card.innerHTML = `
                    <div class="poster-wrapper">
                        <img src="${movie.poster}" alt="${movie.title}" loading="lazy" 
                             onerror="this.src='https://via.placeholder.com/342x513/0a0a0a/334455?text=404'" />
                    </div>
                    <div class="info">
                        <div class="flex justify-between items-start">
                            <h3>${movie.title}</h3>
                        </div>
                        <div class="flex justify-between items-center mt-1">
                            <span class="year">${movie.year || '2026'}</span>
                            <span class="badge-type">${movie.type === 'tv' ? 'Série' : 'Filme'}</span>
                        </div>
                    </div>
                `;
                
                card.addEventListener('click', function() {
                    loadMovie(movie);
                });
                
                grid.appendChild(card);
            });
        }

        // ================================================================
        //  FILTROS
        // ================================================================
        function filterCatalog(filter, query = '') {
            let filtered = [...CATALOG];
            if (filter === 'movie') {
                filtered = filtered.filter(m => m.type === 'movie');
            } else if (filter === 'tv') {
                filtered = filtered.filter(m => m.type === 'tv');
            }
            if (query.trim()) {
                const q = query.toLowerCase();
                filtered = filtered.filter(m => m.title.toLowerCase().includes(q));
            }
            return filtered;
        }

        function loadCatalog(filter = 'all', query = '') {
            const loaderElement = document.querySelector('#loaderGrid .loader-neon');
            if (loaderElement) loaderElement.style.display = 'block';
            const movies = filterCatalog(filter, query);
            if (loaderElement) loaderElement.style.display = 'none';
            renderMovies(movies);
        }

        function handleFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.tab-neon').forEach(tab => tab.classList.remove('active'));
            const activeTab = document.querySelector(`.tab-neon[data-filter="${filter}"]`);
            if (activeTab) activeTab.classList.add('active');
            searchInput.value = '';
            loadCatalog(filter);
        }

        function performSearch() {
            const query = searchInput.value.trim();
            document.querySelectorAll('.tab-neon').forEach(tab => tab.classList.remove('active'));
            loadCatalog('all', query);
        }

        // ================================================================
        //  TROCA DE FONTE
        // ================================================================
        sourceSelector.addEventListener('change', function() {
            if (currentMovie) {
                loadMovie(currentMovie);
            }
        });

        // ================================================================
        //  INIT
        // ================================================================
        function init() {
            initPlyr();
            loadCatalog('all');

            document.querySelectorAll('.tab-neon').forEach(tab => {
                tab.addEventListener('click', function() {
                    handleFilter(this.getAttribute('data-filter'));
                });
            });

            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') performSearch();
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
    </script>

    <footer class="mt-12 pt-6 border-t border-[#00E5FF]/5 text-[10px] text-[#334455] flex justify-between items-center">
        <span>© 2026 Ricoflix · Player Pro</span>
        <span><i class="fas fa-check-circle text-[#00E5FF] mr-1"></i> Dublagem Garantida</span>
    </footer>
</body>
</html>
