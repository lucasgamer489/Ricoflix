<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricoflix</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #090b10; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="bg-[#0b0e14] text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-blue-600 selection:text-white custom-scrollbar">

    <!-- Header / Barra Superior -->
    <header id="header-principal" class="bg-[#0b0e14]/95 backdrop-blur-md border-b border-zinc-900/80 px-8 py-4 flex items-center justify-between sticky top-0 z-50 transition-all">
        <div class="flex items-center gap-8">
            <h1 onclick="mudarAba('filmes')" class="text-2xl font-black text-blue-500 tracking-wider cursor-pointer hover:opacity-80 transition-opacity">Ricoflix</h1>
            <nav class="hidden md:flex items-center gap-6 text-xs font-medium tracking-wide text-zinc-300">
                <button onclick="mudarAba('filmes')" class="hover:text-white transition-colors cursor-pointer">FILMES</button>
                <button onclick="mudarAba('series')" class="hover:text-white transition-colors cursor-pointer">SÉRIES DE TV</button>
                <button onclick="mudarAba('minhalista')" class="hover:text-white transition-colors cursor-pointer">MINHA LISTA</button>
            </nav>
        </div>
        <div class="flex items-center gap-4">
            <div class="relative w-64 hidden lg:block">
                <input type="text" id="input-busca" onkeypress="buscarNoTmdb(event)" placeholder="Pesquisar..." class="w-full bg-zinc-900/70 border border-zinc-800 rounded-full px-4 py-1.5 text-xs text-zinc-200 focus:outline-none focus:border-blue-500 transition-colors">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-6 flex flex-col gap-6">
        
        <!-- Filtros e Navegação -->
        <div id="secao-filtros" class="flex flex-col gap-4 transition-all">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div class="flex items-center gap-3">
                    <button onclick="mudarAba('filmes')" id="btn-tab-filmes" class="filtro-btn bg-blue-600 text-white font-semibold px-5 py-2 rounded-full text-xs tracking-wider shadow-lg shadow-blue-600/30 cursor-pointer transition-all">FILMES</button>
                    <button onclick="mudarAba('series')" id="btn-tab-series" class="filtro-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-5 py-2 rounded-full text-xs tracking-wider border border-zinc-800 cursor-pointer transition-all">SÉRIES</button>
                    <button onclick="mudarAba('minhalista')" id="btn-tab-minhalista" class="filtro-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-5 py-2 rounded-full text-xs tracking-wider border border-zinc-800 cursor-pointer transition-all">MINHA LISTA</button>
                </div>
                
                <!-- Barra de busca mobile -->
                <div class="relative w-full md:hidden">
                    <input type="text" id="input-busca-mobile" onkeypress="buscarNoTmdb(event, true)" placeholder="Pesquisar..." class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2 text-xs text-zinc-200 focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <!-- Botões de Gêneros -->
            <div id="secao-generos" class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none"></div>
        </div>

        <!-- Grade de Catálogo -->
        <div id="catalogo" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>

        <!-- Painel de Detalhes da Série / Episódios -->
        <div id="painel-serie-detalhes" class="hidden flex flex-col gap-6 animate-fadeIn w-full">
            <div class="flex items-center justify-between flex-wrap gap-4 border-b border-zinc-900 pb-4">
                <div class="flex items-center gap-4">
                    <button onclick="voltarHome()" class="text-xs bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-blue-400 px-4 py-2 rounded-lg cursor-pointer transition-all font-medium">&larr; Voltar</button>
                    <h2 class="text-2xl font-bold tracking-tight text-white" id="titulo-serie-header">Episódios</h2>
                </div>
                
                <!-- Seletor de Temporadas -->
                <div class="relative">
                    <select id="select-temporada" onchange="mudarTemporadaMax()" class="bg-[#181b22] border border-zinc-800 text-sm text-zinc-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500 cursor-pointer appearance-none pr-10 font-medium">
                        <option value="1">Temporada 1</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-zinc-400">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
                    </div>
                </div>
            </div>

            <!-- Grade de Episódios -->
            <div id="grade-episodios-max" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
        </div>

        <!-- Seção do Player (Com Bloqueio Anti-Redirecionamento) -->
        <div id="painel-player" class="mt-2 flex flex-col gap-3 hidden animate-fadeIn w-full">
            <div class="flex items-center justify-between flex-wrap gap-3 bg-zinc-950/60 p-3 rounded-xl border border-zinc-900">
                <div class="flex items-center gap-3">
                    <button onclick="fecharPlayerParaEpisodios()" class="text-xs bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-blue-400 px-4 py-2 rounded-lg cursor-pointer transition-all font-medium">&larr; Voltar</button>
                    <h2 id="titulo-player" class="text-sm font-bold text-zinc-200">Assistindo a: -</h2>
                </div>
                
                <div class="flex items-center gap-3">
                    <div class="text-xs bg-blue-500/10 border border-blue-500/30 text-blue-400 px-3 py-1.5 rounded-full font-bold flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></span> Redetoons Player
                    </div>
                </div>
            </div>

            <!-- Container do Player Blindado -->
            <div class="w-full bg-black rounded-2xl overflow-hidden shadow-2xl border border-zinc-900 relative" style="aspect-ratio: 16/9;">
                <iframe id="meu-player" src="" 
                        class="absolute inset-0 w-full h-full border-0" 
                        allowfullscreen="true" 
                        webkitallowfullscreen="true" 
                        mozallowfullscreen="true" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share">
                </iframe>
                <!-- Camada transparente para bloquear cliques diretos indesejados no iframe -->
                <div style="position: absolute; top: 0; left: 0; width: 100%; height: 85%; pointer-events: none;"></div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer id="footer-principal" class="bg-[#0b0e14] border-t border-zinc-900/80 text-center py-6 text-xs text-zinc-600 mt-12">
        Ricoflix &copy; 2026 - Todos os direitos reservados
    </footer>

    <!-- Script Principal -->
    <script>
        const API_KEY = '3cbe2c38513cc9d3266f2dc134ce9b29';
        const IMG_BASE_URL = 'https://image.tmdb.org/t/p/w342';
        const STILL_BASE_URL = 'https://image.tmdb.org/t/p/w500';
        
        let abaAtual = 'filmes';
        let serieAtualCache = null;

        function mudarAba(novaAba) {
            abaAtual = novaAba;
            document.getElementById('painel-player').classList.add('hidden');
            document.getElementById('painel-serie-detalhes').classList.add('hidden');
            document.getElementById('catalogo').classList.remove('hidden');
            document.getElementById('secao-filtros').classList.remove('hidden');
            document.getElementById('header-principal').classList.remove('hidden');
            document.getElementById('footer-principal').classList.remove('hidden');

            document.getElementById('btn-tab-filmes').className = "filtro-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-5 py-2 rounded-full text-xs tracking-wider border border-zinc-800 cursor-pointer transition-all";
            document.getElementById('btn-tab-series').className = "filtro-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-5 py-2 rounded-full text-xs tracking-wider border border-zinc-800 cursor-pointer transition-all";
            document.getElementById('btn-tab-minhalista').className = "filtro-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-5 py-2 rounded-full text-xs tracking-wider border border-zinc-800 cursor-pointer transition-all";

            if (abaAtual === 'filmes') {
                document.getElementById('btn-tab-filmes').className = "filtro-btn bg-blue-600 text-white font-semibold px-5 py-2 rounded-full text-xs tracking-wider shadow-lg shadow-blue-600/30";
                carregarConteudoFilmes();
            } else if (abaAtual === 'series') {
                document.getElementById('btn-tab-series').className = "filtro-btn bg-blue-600 text-white font-semibold px-5 py-2 rounded-full text-xs tracking-wider shadow-lg shadow-blue-600/30";
                carregarConteudoSeries();
            } else if (abaAtual === 'minhalista') {
                document.getElementById('btn-tab-minhalista').className = "filtro-btn bg-blue-600 text-white font-semibold px-5 py-2 rounded-full text-xs tracking-wider shadow-lg shadow-blue-600/30";
                document.getElementById('secao-generos').innerHTML = '';
                carregarMinhaLista();
            }
        }

        async function carregarConteudoFilmes() {
            carregarGeneros('movie');
            try {
                const resposta = await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=pt-BR`);
                const dados = await resposta.json();
                exibirCards(dados.results, 'movie');
            } catch (erro) {
                console.error("Erro filmes:", erro);
            }
        }

        async function carregarConteudoSeries() {
            carregarGeneros('tv');
            try {
                const resposta = await fetch(`https://api.themoviedb.org/3/tv/popular?api_key=${API_KEY}&language=pt-BR`);
                const dados = await resposta.json();
                exibirCards(dados.results, 'tv');
            } catch (erro) {
                console.error("Erro séries:", erro);
            }
        }

        async function carregarGeneros(tipo) {
            const containerGeneros = document.getElementById('secao-generos');
            containerGeneros.innerHTML = '';
            try {
                const resposta = await fetch(`https://api.themoviedb.org/3/genre/${tipo}/list?api_key=${API_KEY}&language=pt-BR`);
                const dados = await resposta.json();

                const funcTodos = tipo === 'movie' ? 'carregarConteudoFilmes()' : 'carregarConteudoSeries()';
                containerGeneros.innerHTML = `<button onclick="${funcTodos}" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs px-3.5 py-1.5 rounded-lg whitespace-nowrap cursor-pointer font-medium">Todos</button>`;
                
                dados.genres.forEach(g => {
                    containerGeneros.innerHTML += `<button onclick="filtrarPorGenero('${tipo}', ${g.id})" class="bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-400 text-xs px-3.5 py-1.5 rounded-lg whitespace-nowrap cursor-pointer transition-colors font-medium">${g.name}</button>`;
                });
            } catch (e) {
                console.error("Erro gêneros:", e);
            }
        }

        async function filtrarPorGenero(tipo, genreId) {
            try {
                const resposta = await fetch(`https://api.themoviedb.org/3/discover/${tipo}?api_key=${API_KEY}&language=pt-BR&with_genres=${genreId}`);
                const dados = await resposta.json();
                exibirCards(dados.results, tipo);
            } catch (e) {
                console.error("Erro filtrar gênero:", e);
            }
        }

        async function buscarNoTmdb(event, isMobile = false) {
            if (event.key === 'Enter') {
                const inputId = isMobile ? 'input-busca-mobile' : 'input-busca';
                const termo = document.getElementById(inputId).value.trim();
                if (!termo) return;

                try {
                    const resFilme = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&language=pt-BR&query=${encodeURIComponent(termo)}`);
                    const dadosFilme = await resFilme.json();
                    
                    const resTv = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${API_KEY}&language=pt-BR&query=${encodeURIComponent(termo)}`);
                    const dadosTv = await resTv.json();

                    const filmes = (dadosFilme.results || []).map(item => ({ ...item, media_type: 'movie' }));
                    const series = (dadosTv.results || []).map(item => ({ ...item, media_type: 'tv' }));
                    
                    const resultados = [...filmes, ...series].filter(item => item.poster_path);
                    
                    if (resultados.length > 0) {
                        document.getElementById('painel-player').classList.add('hidden');
                        document.getElementById('painel-serie-detalhes').classList.add('hidden');
                        document.getElementById('catalogo').classList.remove('hidden');
                        document.getElementById('secao-filtros').classList.remove('hidden');
                        document.getElementById('header-principal').classList.remove('hidden');
                        exibirCardsComTipoMisto(resultados);
                    } else {
                        alert("Nenhum resultado encontrado!");
                    }
                } catch (erro) {
                    console.error("Erro na busca:", erro);
                }
            }
        }

        function obterMinhaLista() {
            return JSON.parse(localStorage.getItem('ricoflix_lista') || '[]');
        }

        function alternarFavorito(event, id, titulo, poster, ano, tipo) {
            event.stopPropagation();
            let lista = obterMinhaLista();
            const index = lista.findIndex(item => item.id === id);

            if (index > -1) {
                lista.splice(index, 1);
            } else {
                lista.push({ id, titulo, poster, tipo, ano });
            }

            localStorage.setItem('ricoflix_lista', JSON.stringify(lista));
            
            const btn = event.currentTarget;
            btn.classList.toggle('text-blue-500');
            btn.classList.toggle('text-zinc-400');
        }

        function carregarMinhaLista() {
            document.getElementById('secao-generos').innerHTML = '';
            const lista = obterMinhaLista();
            const catalogo = document.getElementById('catalogo');
            catalogo.innerHTML = '';

            if (lista.length === 0) {
                catalogo.innerHTML = '<div class="col-span-full text-center py-12 text-zinc-500 text-sm">Sua lista está vazia. Adicione filmes ou séries clicando no ícone de favorito!</div>';
                return;
            }

            lista.forEach(item => {
                catalogo.innerHTML += `
                    <div onclick="abrirItem(${item.id}, '${item.titulo.replace(/'/g, "\\'")}', '${item.tipo}')" class="card-item bg-zinc-900/60 border border-zinc-900 rounded-xl overflow-hidden flex flex-col group cursor-pointer hover:border-blue-500 transition-all duration-300 hover:shadow-lg hover:shadow-blue-500/15 relative">
                        <div class="aspect-[2/3] bg-zinc-800 relative overflow-hidden">
                            <img src="${item.poster}" alt="${item.titulo}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
                            <button onclick="alternarFavorito(event, ${item.id}, '${item.titulo.replace(/'/g, "\\'")}', '${item.poster}', '${item.ano}', '${item.tipo}')" class="absolute top-2 left-2 bg-zinc-950/80 p-1.5 rounded-full text-blue-500 hover:scale-110 transition-transform z-10">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            </button>
                        </div>
                        <div class="p-3 flex flex-col justify-between flex-1">
                            <h3 class="text-sm font-bold text-zinc-200 truncate group-hover:text-blue-400 transition-colors">${item.titulo}</h3>
                            <div class="flex items-center justify-between text-xs text-zinc-400 mt-2">
                               <span>${item.ano}</span>
                               <span class="text-[10px] bg-zinc-800 px-2 py-0.5 rounded text-zinc-300">${item.tipo === 'tv' ? 'Série' : 'Filme'}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function exibirCards(itens, tipo) {
            const catalogo = document.getElementById('catalogo');
            catalogo.innerHTML = '';
            const favoritos = obterMinhaLista();

            itens.forEach(item => {
                if (!item.poster_path) return;
                const titulo = item.title || item.name;
                const dataStr = item.release_date || item.first_air_date || '2026';
                const ano = dataStr.split('-')[0];
                const poster = IMG_BASE_URL + item.poster_path;
                const isFavorito = favoritos.some(f => f.id === item.id);

                catalogo.innerHTML += `
                    <div onclick="abrirItem(${item.id}, '${titulo.replace(/'/g, "\\'")}', '${tipo}')" class="card-item bg-zinc-900/60 border border-zinc-900 rounded-xl overflow-hidden flex flex-col group cursor-pointer hover:border-blue-500 transition-all duration-300 hover:shadow-lg hover:shadow-blue-500/15 relative">
                        <div class="aspect-[2/3] bg-zinc-800 relative overflow-hidden">
                            <img src="${poster}" alt="${titulo}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
                            <button onclick="alternarFavorito(event, ${item.id}, '${titulo.replace(/'/g, "\\'")}', '${poster}', '${ano}', '${tipo}')" class="absolute top-2 left-2 bg-zinc-950/80 p-1.5 rounded-full ${isFavorito ? 'text-blue-500' : 'text-zinc-400'} hover:scale-110 transition-transform z-10">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            </button>
                        </div>
                        <div class="p-3 flex flex-col justify-between flex-1">
                            <h3 class="text-sm font-bold text-zinc-200 truncate group-hover:text-blue-400 transition-colors">${titulo}</h3>
                            <div class="flex items-center justify-between text-xs text-zinc-400 mt-2">
                               <span>${ano}</span>
                               <span class="text-[10px] bg-zinc-800 px-2 py-0.5 rounded text-zinc-300">${tipo === 'tv' ? 'Série' : 'Filme'}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function exibirCardsComTipoMisto(itens) {
            const catalogo = document.getElementById('catalogo');
            catalogo.innerHTML = '';
            const favoritos = obterMinhaLista();

            itens.forEach(item => {
                if (!item.poster_path) return;
                const tipo = item.media_type || (item.name ? 'tv' : 'movie');
                const titulo = item.title || item.name;
                const dataStr = item.release_date || item.first_air_date || '2026';
                const ano = dataStr.split('-')[0];
                const poster = IMG_BASE_URL + item.poster_path;
                const isFavorito = favoritos.some(f => f.id === item.id);

                catalogo.innerHTML += `
                    <div onclick="abrirItem(${item.id}, '${titulo.replace(/'/g, "\\'")}', '${tipo}')" class="card-item bg-zinc-900/60 border border-zinc-900 rounded-xl overflow-hidden flex flex-col group cursor-pointer hover:border-blue-500 transition-all duration-300 hover:shadow-lg hover:shadow-blue-500/15 relative">
                        <div class="aspect-[2/3] bg-zinc-800 relative overflow-hidden">
                            <img src="${poster}" alt="${titulo}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
                            <button onclick="alternarFavorito(event, ${item.id}, '${titulo.replace(/'/g, "\\'")}', '${poster}', '${ano}', '${tipo}')" class="absolute top-2 left-2 bg-zinc-950/80 p-1.5 rounded-full ${isFavorito ? 'text-blue-500' : 'text-zinc-400'} hover:scale-110 transition-transform z-10">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            </button>
                        </div>
                        <div class="p-3 flex flex-col justify-between flex-1">
                            <h3 class="text-sm font-bold text-zinc-200 truncate group-hover:text-blue-400 transition-colors">${titulo}</h3>
                            <div class="flex items-center justify-between text-xs text-zinc-400 mt-2">
                               <span>${ano}</span>
                               <span class="text-[10px] bg-zinc-800 px-2 py-0.5 rounded text-zinc-300">${tipo === 'tv' ? 'Série' : 'Filme'}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        async function abrirItem(id, titulo, tipo) {
            document.getElementById('catalogo').classList.add('hidden');
            document.getElementById('secao-filtros').classList.add('hidden');

            if (tipo === 'tv') {
                document.getElementById('header-principal').classList.remove('hidden');
                document.getElementById('footer-principal').classList.remove('hidden');
                document.getElementById('painel-serie-detalhes').classList.remove('hidden');
                document.getElementById('titulo-serie-header').innerText = titulo;
                serieAtualCache = { id, titulo };
                await carregarTemporadasMax(id);
            } else {
                document.getElementById('header-principal').classList.add('hidden');
                document.getElementById('footer-principal').classList.add('hidden');
                document.getElementById('painel-player').classList.remove('hidden');
                document.getElementById('titulo-player').innerText = 'Assistindo a: ' + titulo;

                const linkPlayer = `https://redetoons.win/watch/movie?id=${id}&type=movie`;
                document.getElementById('meu-player').src = linkPlayer;
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function carregarTemporadasMax(idSerie) {
            try {
                const resposta = await fetch(`https://api.themoviedb.org/3/tv/${idSerie}?api_key=${API_KEY}&language=pt-BR`);
                const dados = await resposta.json();

                const selectTemp = document.getElementById('select-temporada');
                selectTemp.innerHTML = '';

                const temporadasValidas = dados.seasons.filter(s => s.season_number > 0);
                
                temporadasValidas.forEach(s => {
                    selectTemp.innerHTML += `<option value="${s.season_number}">Temporada ${s.season_number}</option>`;
                });

                if (temporadasValidas.length > 0) {
                    await carregarEpisodiosMax(idSerie, temporadasValidas[0].season_number);
                }
            } catch (e) {
                console.error("Erro temporadas:", e);
            }
        }

        async function carregarEpisodiosMax(idSerie, temporadaNum) {
            try {
                const resposta = await fetch(`https://api.themoviedb.org/3/tv/${idSerie}/season/${temporadaNum}?api_key=${API_KEY}&language=pt-BR`);
                const dados = await resposta.json();

                const gradeEpisodios = document.getElementById('grade-episodios-max');
                gradeEpisodios.innerHTML = '';

                if (!dados.episodes || dados.episodes.length === 0) {
                    gradeEpisodios.innerHTML = '<div class="col-span-full text-center py-12 text-zinc-500 text-sm">Nenhum episódio encontrado para esta temporada.</div>';
                    return;
                }

                dados.episodes.forEach(ep => {
                    const thumb = ep.still_path ? (STILL_BASE_URL + ep.still_path) : 'https://images.unsplash.com/photo-1594909122845-11baa439b7bf?w=500&auto=format&fit=crop&q=60';
                    const sinopse = ep.overview ? ep.overview : 'Nenhuma descrição disponível para este episódio.';
                    
                    gradeEpisodios.innerHTML += `
                        <div onclick="reproduzirEpisodioSerie(${temporadaNum}, ${ep.episode_number}, '${ep.name.replace(/'/g, "\\'")}')" class="flex flex-col gap-2.5 group cursor-pointer bg-zinc-900/40 p-2.5 rounded-2xl border border-zinc-900 hover:border-blue-500/60 transition-all">
                            <div class="aspect-video w-full bg-zinc-800 rounded-xl overflow-hidden relative shadow-md">
                                <img src="${thumb}" alt="${ep.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
                                <div class="absolute inset-0 bg-black/20 group-hover:bg-black/0 transition-colors flex items-center justify-center opacity-0 group-hover:opacity-100">
                                    <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-lg transform scale-90 group-hover:scale-100 transition-transform">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                    </div>
                                </div>
                            </div>
                            <div class="flex flex-col gap-1 px-1">
                                <h3 class="text-xs font-bold text-zinc-200 group-hover:text-blue-400 transition-colors">${ep.episode_number}. ${ep.name}</h3>
                                <p class="text-[11px] text-zinc-400 line-clamp-2 leading-relaxed">${sinopse}</p>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Erro episódios max:", e);
            }
        }

        async function mudarTemporadaMax() {
            const tempNum = document.getElementById('select-temporada').value;
            if (serieAtualCache) {
                await carregarEpisodiosMax(serieAtualCache.id, tempNum);
            }
        }

        function reproduzirEpisodioSerie(temporada, episodio, nomeEpisodio) {
            document.getElementById('header-principal').classList.add('hidden');
            document.getElementById('footer-principal').classList.add('hidden');
            document.getElementById('painel-serie-detalhes').classList.add('hidden');
            document.getElementById('painel-player').classList.remove('hidden');

            document.getElementById('titulo-player').innerText = `Assistindo: ${serieAtualCache.titulo} - T${temporada}:E${episodio} (${nomeEpisodio})`;

            const url = `https://redetoons.win/watch/t${temporada}-ep${episodio}/${encodeURIComponent(serieAtualCache.titulo.toLowerCase().replace(/ /g, '-'))}?id=${serieAtualCache.id}&type=tv`;
            document.getElementById('meu-player').src = url;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function fecharPlayerParaEpisodios() {
            document.getElementById('painel-player').classList.add('hidden');
            document.getElementById('meu-player').src = '';
            document.getElementById('header-principal').classList.remove('hidden');
            document.getElementById('footer-principal').classList.remove('hidden');
            document.getElementById('painel-serie-detalhes').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function voltarHome() {
            document.getElementById('painel-player').classList.add('hidden');
            document.getElementById('painel-serie-detalhes').classList.add('hidden');
            document.getElementById('catalogo').classList.remove('hidden');
            document.getElementById('secao-filtros').classList.remove('hidden');
            document.getElementById('header-principal').classList.remove('hidden');
            document.getElementById('footer-principal').classList.remove('hidden');
            document.getElementById('meu-player').src = '';
            
            if (abaAtual === 'filmes') carregarConteudoFilmes();
            else if (abaAtual === 'series') carregarConteudoSeries();
            else if (abaAtual === 'minhalista') carregarMinhaLista();

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        carregarConteudoFilmes();
    </script>
</body>
</html>
