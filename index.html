<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricoflix - Sala de Cinema</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0b0b0b; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: #141414; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 32px; font-weight: 900; color: #00bcd4; letter-spacing: -1px; }
        .criar-sala-btn { background: #00bcd4; color: #000; padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .criar-sala-btn:hover { background: #00e5ff; }

        .container { max-width: 1400px; margin: 0 auto; padding: 40px 50px; }
        
        .filtros { display: flex; gap: 15px; margin-bottom: 40px; }
        .filtro-btn { background: transparent; border: none; color: #888; font-size: 16px; padding: 10px 20px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .filtro-btn.active { color: #00bcd4; border-bottom: 3px solid #00bcd4; }

        .grid-catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; }
        .card { position: relative; background: #141414; border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0, 188, 212, 0.2); }
        .card img { width: 100%; height: 300px; object-fit: cover; }
        .card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 60%); }
        .card-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px; }
        .card-title { font-size: 18px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .card-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
        .card-year { color: #bbb; font-size: 14px; }
        .card-badge { background: #00bcd4; color: #000; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }

        .serie-area { display: none; padding: 40px 50px; max-width: 1400px; margin: 0 auto; }
        .voltar-btn { background: #333; border: none; color: #fff; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 30px; }
        .voltar-btn:hover { background: #555; }
        .temp-buttons { display: flex; gap: 10px; margin-bottom: 40px; }
        .temp-btn { background: #1a1a1a; border: 1px solid #333; color: #aaa; padding: 10px 20px; border-radius: 50px; cursor: pointer; font-weight: bold; }
        .temp-btn.active { background: #fff; color: #000; border-color: #fff; }

        .grid-episodios { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .ep-card { cursor: pointer; transition: transform 0.3s; }
        .ep-card:hover { transform: scale(1.03); }
        .ep-thumb-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: #222; margin-bottom: 15px; }
        .ep-thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .ep-num { color: #00bcd4; font-weight: bold; margin-bottom: 5px; }
        .ep-title { font-size: 18px; font-weight: bold; }
        .ep-desc { font-size: 14px; color: #888; line-height: 1.5; margin-top: 5px; }

        .sala-area { display: none; padding: 20px; max-width: 1400px; margin: 0 auto; }
        .sala-container { display: grid; grid-template-columns: 3fr 1fr; gap: 20px; }
        .player-box { width: 100%; aspect-ratio: 16/9; background: black; border-radius: 12px; overflow: hidden; }
        .player-box video { width: 100%; height: 100%; }
        .player-box iframe { width: 100%; height: 100%; border: none; }
        
        .chat-box { background: #141414; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; height: 100%; max-height: 600px; }
        .chat-header { font-weight: bold; margin-bottom: 15px; color: #00bcd4; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .chat-messages { flex: 1; overflow-y: auto; margin-bottom: 15px; }
        .chat-msg { margin-bottom: 10px; font-size: 14px; }
        .chat-msg strong { color: #00bcd4; }
        .chat-input-area { display: flex; gap: 10px; }
        .chat-input-area input { background: #222; border: 1px solid #444; border-radius: 20px; padding: 10px 15px; color: #fff; flex: 1; outline: none; }
        .chat-input-area button { background: #00bcd4; border: none; border-radius: 20px; padding: 10px 20px; color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Ricoflix</div>
        <button class="criar-sala-btn" onclick="criarSala()">🎬 Criar Sala</button>
    </header>

    <div class="container" id="tela-catalogo">
        <div class="filtros">
            <button class="filtro-btn active" onclick="filtrar('tudo')">Tudo</button>
            <button class="filtro-btn" onclick="filtrar('filme')">Filmes</button>
            <button class="filtro-btn" onclick="filtrar('serie')">Séries</button>
        </div>
        <div class="grid-catalogo" id="grid-catalogo"></div>
    </div>

    <div id="tela-serie" class="serie-area">
        <button class="voltar-btn" onclick="voltarCatalogo()">← Voltar</button>
        <h1 id="titulo-serie" style="font-size: 40px; font-weight: 900; margin-bottom: 20px;"></h1>
        <div class="temp-buttons" id="botoes-temporada"></div>
        <div class="grid-episodios" id="lista-episodios"></div>
    </div>

    <div id="tela-sala" class="sala-area">
        <button class="voltar-btn" onclick="voltarCatalogo()">← Voltar</button>
        <div class="sala-container">
            <div class="player-box" id="player-box">
                <p style="color:#555; text-align:center; padding-top: 200px;">Carregando...</p>
            </div>
            <div class="chat-box">
                <div class="chat-header">💬 Chat da Sala</div>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Digite..." onkeypress="if(event.key === 'Enter') enviarMensagem()">
                    <button onclick="enviarMensagem()">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // SUPABASE
        const SUPABASE_URL = 'https://jqolqvtavnbowlmehzo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impxb2xxdnRhdm5ib3dsbW5laHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyODY0MzksImV4cCI6MjEwMzg2MjQzOX0.AA-ld5Q2HFr213o1RySdEYBeQ-96CQV5LWb2ieSZC7A';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let salaAtual = null;
        let userName = 'User' + Math.floor(Math.random() * 1000);
        let videoAtualLink = null;

        const filmes = [
            { id: 'filme1', titulo: 'Sonic 3', ano: 2024, tipo: 'filme', img: 'sonic.jpg', video: 'https://quvh4oxodaakzovy.public.blob.vercel-storage.com/Sonic%203%20Filme%20Dublado.mp4' },
            { id: 'filme2', titulo: 'Deadpool 3', ano: 2024, tipo: 'filme', img: 'deadpool.jpg', video: 'https://vidsrc.to/embed/movie/tt6263850' },
            { id: 'serie1', titulo: 'O Incrível Mundo de Gumball', ano: 2011, tipo: 'serie', img: 'gumball.jpg' }
        ];

        const seriesData = {
            'serie1': {
                nome: 'O Incrível Mundo de Gumball',
                temporadas: {
                    1: [
                        { num: 1, titulo: 'O Responsável', desc: 'Gumball e Darwin cuidam de Anais.', video: 'https://vidsrc.to/embed/tv/tt18259086/1/1', img: 'https://beam-images.warnermediacdn.com/BEAM_LWM_DELIVERABLES/d8a97b35-2578-44e9-835e-296095eb76cc/53d62f56599a91c276fcd83a6822ec175591683c.jpg?host=wbd-images.prod-vod.h264.io&partner=beamcom&w=320' },
                        { num: 2, titulo: 'Laser Vídeo', desc: 'Gumball está desesperado por causa de um DVD.', video: 'https://vidsrc.to/embed/tv/tt18259086/1/2', img: 'https://beam-images.warnermediacdn.com/BEAM_LWM_DELIVERABLES/c2b6a2d8-08b9-43ae-9721-e0b05496959e/619f40e4ce41d8672a1d5452285356f6493100fe.jpg?host=wbd-images.prod-vod.h264.io&partner=beamcom&w=320' }
                    ]
                }
            }
        };

        function renderizarCatalogo() {
            const grid = document.getElementById('grid-catalogo');
            grid.innerHTML = '';
            filmes.forEach(item => {
                const tipoBadge = item.tipo === 'filme' ? 'FILME' : 'SÉRIE';
                grid.innerHTML += `<div class="card" onclick="abrirItem('${item.id}')">
                    <img src="${item.img}" onerror="this.src='https://placehold.co/400x600/1a1a1a/00bcd4?text=${item.titulo}'">
                    <div class="card-overlay"></div>
                    <div class="card-info">
                        <div class="card-title">${item.titulo}</div>
                        <div class="card-meta">
                            <span class="card-year">${item.ano}</span>
                            <span class="card-badge">${tipoBadge}</span>
                        </div>
                    </div>
                </div>`;
            });
        }

        function filtrar(tipo) {
            document.querySelectorAll('.filtro-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            const grid = document.getElementById('grid-catalogo');
            grid.innerHTML = '';
            const listaFiltrada = tipo === 'tudo' ? filmes : filmes.filter(f => f.tipo === tipo);
            listaFiltrada.forEach(item => {
                const tipoBadge = item.tipo === 'filme' ? 'FILME' : 'SÉRIE';
                grid.innerHTML += `<div class="card" onclick="abrirItem('${item.id}')">
                    <img src="${item.img}" onerror="this.src='https://placehold.co/400x600/1a1a1a/00bcd4?text=${item.titulo}'">
                    <div class="card-overlay"></div>
                    <div class="card-info">
                        <div class="card-title">${item.titulo}</div>
                        <div class="card-meta">
                            <span class="card-year">${item.ano}</span>
                            <span class="card-badge">${tipoBadge}</span>
                        </div>
                    </div>
                </div>`;
            });
        }

        function criarSala() {
            salaAtual = Math.random().toString(36).substring(2, 10).toUpperCase();
            const link = window.location.origin + window.location.pathname + '?sala=' + salaAtual;
            navigator.clipboard.writeText(link);
            alert('Sala criada! Link: ' + link);
            document.getElementById('tela-catalogo').style.display = 'none';
            document.getElementById('tela-sala').style.display = 'block';
            carregarMensagens();
        }

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('sala')) {
            salaAtual = urlParams.get('sala');
            document.getElementById('tela-catalogo').style.display = 'none';
            document.getElementById('tela-sala').style.display = 'block';
            carregarMensagens();
        }

        function abrirItem(id) {
            const item = filmes.find(f => f.id === id);
            if (item.tipo === 'filme') abrirPlayer(item.video);
            else abrirSerie(id);
        }

        function abrirPlayer(linkVideo) {
            videoAtualLink = linkVideo;
            document.getElementById('tela-catalogo').style.display = 'none';
            document.getElementById('tela-serie').style.display = 'none';
            document.getElementById('tela-sala').style.display = 'block';
            
            if (linkVideo.includes('.mp4')) {
                document.getElementById('player-box').innerHTML = `<video controls autoplay><source src="${linkVideo}" type="video/mp4"></video>`;
            } else {
                document.getElementById('player-box').innerHTML = `<iframe src="${linkVideo}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            }

            if (salaAtual) {
                sincronizarVideo(linkVideo);
                carregarMensagens();
            }
        }

        function abrirSerie(id) {
            document.getElementById('tela-catalogo').style.display = 'none';
            document.getElementById('tela-sala').style.display = 'none';
            const serie = seriesData[id];
            document.getElementById('titulo-serie').innerText = serie.nome;
            const botoesTemp = document.getElementById('botoes-temporada');
            botoesTemp.innerHTML = '';
            Object.keys(serie.temporadas).forEach(temp => {
                botoesTemp.innerHTML += `<button class="temp-btn" onclick="mudarTemporada('${id}', ${temp}, this)">Temporada ${temp}</button>`;
            });
            document.getElementById('tela-serie').style.display = 'block';
            mudarTemporada(id, 1, botoesTemp.firstChild);
        }

        function mudarTemporada(idSerie, numTemp, btnClicado) {
            document.querySelectorAll('.temp-btn').forEach(b => b.classList.remove('active'));
            btnClicado.classList.add('active');
            const eps = seriesData[idSerie].temporadas[numTemp];
            const lista = document.getElementById('lista-episodios');
            lista.innerHTML = '';
            eps.forEach(ep => {
                const thumbSrc = ep.img ? ep.img : `https://placehold.co/640x360/222/00bcd4?text=Epis%C3%B3dio+${ep.num}`;
                lista.innerHTML += `<div class="ep-card" onclick="abrirPlayer('${ep.video}')">
                    <div class="ep-thumb-wrapper">
                        <img src="${thumbSrc}" onerror="this.src='https://placehold.co/640x360/222/00bcd4?text=Epis%C3%B3dio+${ep.num}'">
                    </div>
                    <div class="ep-num">Episódio ${ep.num}</div>
                    <div class="ep-title">${ep.titulo}</div>
                    <div class="ep-desc">${ep.desc}</div>
                </div>`;
            });
        }

        function voltarCatalogo() {
            document.getElementById('player-box').innerHTML = '<p style="color:#555; text-align:center; padding-top: 200px;">Carregando...</p>';
            document.getElementById('tela-serie').style.display = 'none';
            document.getElementById('tela-sala').style.display = 'none';
            document.getElementById('tela-catalogo').style.display = 'block';
            renderizarCatalogo();
        }

        // CHAT & SYNC
        async function carregarMensagens() {
            if (!salaAtual) return;
            const { data } = await supabase.from('messages').select('*').eq('room_id', salaAtual).order('id', { ascending: true });
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = '';
            (data || []).forEach(msg => {
                chatBox.innerHTML += `<div class="chat-msg"><strong>${msg.username}:</strong> ${msg.content}</div>`;
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function enviarMensagem() {
            const input = document.getElementById('chat-input');
            const content = input.value.trim();
            if (!content || !salaAtual) return;
            await supabase.from('messages').insert([{ username: userName, content: content, room_id: salaAtual }]);
            input.value = '';
            carregarMensagens();
        }

        async function sincronizarVideo(link) {
            if (!salaAtual) return;
            await supabase.from('messages').insert([{ username: 'SISTEMA', content: 'VIDEO:' + link, room_id: salaAtual }]);
            carregarMensagens();
        }

        supabase.channel('sala-' + (salaAtual || 'geral')).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
            const msg = payload.new;
            if (msg.content.startsWith('VIDEO:') && msg.content.split('VIDEO:')[1] !== videoAtualLink) {
                const novoLink = msg.content.split('VIDEO:')[1];
                abrirPlayer(novoLink);
            }
            carregarMensagens();
        }).subscribe();

        window.onload = renderizarCatalogo;
    </script>
</body>
</html>
