<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricoflix</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Barra Superior -->
    <header class="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-6">
            <h1 onclick="voltarHome()" class="text-2xl font-black text-cyan-400 tracking-wider cursor-pointer">Ricoflix</h1>
            <span class="text-xs bg-zinc-800 text-cyan-300 px-3 py-1 rounded-full border border-cyan-900">Dublado PT-BR</span>
        </div>
        <div class="relative w-72">
            <input type="text" id="input-busca" oninput="pesquisarFilmes()" placeholder="Pesquisar filmes..." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 text-sm text-zinc-200 focus:outline-none focus:border-cyan-500">
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-6 flex flex-col gap-6">
        
        <!-- Filtros -->
        <div id="secao-filtros" class="flex items-center gap-3">
            <button onclick="filtrar('todos', this)" class="filtro-btn bg-cyan-500 text-zinc-950 font-semibold px-4 py-1.5 rounded-full text-sm cursor-pointer transition-all">Todos</button>
            <button onclick="filtrar('filme', this)" class="filtro-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-4 py-1.5 rounded-full text-sm border border-zinc-800 cursor-pointer transition-all">Filmes</button>
            <button onclick="filtrar('serie', this)" class="filtro-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-4 py-1.5 rounded-full text-sm border border-zinc-800 cursor-pointer transition-all">Séries</button>
        </div>

        <!-- Grade de Catálogo (Preenchida via API do TMDB) -->
        <div id="catalogo" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <!-- Carregando via JavaScript -->
        </div>

        <!-- Seção do Player -->
        <div id="painel-player" class="mt-4 flex flex-col gap-4 hidden">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
                    <h2 id="titulo-player" class="text-sm font-semibold text-zinc-300">Assistindo a: -</h2>
                </div>
                <span class="text-xs bg-zinc-900 border border-zinc-800 text-cyan-400 px-3 py-1 rounded-full font-bold">1080p HD Nativo</span>
            </div>

            <!-- Container do Iframe -->
            <div class="w-full bg-black rounded-xl overflow-hidden shadow-2xl border border-zinc-800" style="aspect-ratio: 16/9; position: relative;">
                <iframe id="meu-player" src="" 
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;" 
                        allowfullscreen="true" 
                        webkitallowfullscreen="true" 
                        mozallowfullscreen="true" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
                </iframe>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-zinc-900 border-t border-zinc-800 text-center py-4 text-xs text-zinc-500 mt-12">
        Ricoflix &copy; 2026 - Todos os direitos reservados
    </footer>

    <!-- Script com API do TMDB -->
    <script>
        const API_KEY = '3cbe2c38513cc9d3266f2dc134ce9b29';
        const IMG_BASE_URL = 'https://image.tmdb.org/t/p/w342';

        async function carregarCatalogo() {
            try {
                const resposta = await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=pt-BR`);
                const dados = await resposta.json();
                
                const catalogo = document.getElementById('catalogo');
                catalogo.innerHTML = '';

                dados.results.forEach(filme => {
                    const ano = filme.release_date ? filme.release_date.split('-')[0] : '2026';
                    const poster = filme.poster_path ? IMG_BASE_URL + filme.poster_path : 'https://via.placeholder.com/300x450?text=Sem+Capa';

                    catalogo.innerHTML += `
                        <div onclick="abrirFilme('${filme.title}', 'https://embed.rgshows.me/movie/${filme.id}')" class="card-item bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden flex flex-col group cursor-pointer hover:border-cyan-500 transition-all" data-tipo="filme" data-titulo="${filme.title.toLowerCase()}">
                            <div class="aspect-[2/3] bg-zinc-800 relative overflow-hidden">
                                <img src="${poster}" alt="${filme.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                                <span class="absolute top-2 right-2 bg-cyan-950/80 border border-cyan-500/50 text-cyan-400 text-[10px] font-bold px-2 py-0.5 rounded">DUBLADO</span>
                            </div>
                            <div class="p-3 flex flex-col justify-between flex-1">
                                <h3 class="text-sm font-bold text-zinc-200 truncate">${filme.title}</h3>
                                <div class="flex items-center justify-between text-xs text-zinc-400 mt-2">
                                    <span>${ano}</span>
                                    <span class="text-[10px] bg-zinc-800 px-2 py-0.5 rounded text-zinc-300">Filme</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (erro) {
                console.error("Erro ao carregar TMDB:", erro);
            }
        }

        function filtrar(tipo, elemento) {
            document.querySelectorAll('.filtro-btn').forEach(btn => {
                btn.className = "filtro-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-4 py-1.5 rounded-full text-sm border border-zinc-800 cursor-pointer transition-all";
            });
            elemento.className = "filtro-btn bg-cyan-500 text-zinc-950 font-semibold px-4 py-1.5 rounded-full text-sm cursor-pointer transition-all";

            document.querySelectorAll('.card-item').forEach(card => {
                if (tipo === 'todos' || card.getAttribute('data-tipo') === tipo) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function pesquisarFilmes() {
            const termo = document.getElementById('input-busca').value.toLowerCase();
            document.querySelectorAll('.card-item').forEach(card => {
                const titulo = card.getAttribute('data-titulo');
                if (titulo.includes(termo)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function voltarHome() {
            document.getElementById('painel-player').classList.add('hidden');
            document.getElementById('catalogo').classList.remove('hidden');
            document.getElementById('secao-filtros').classList.remove('hidden');
            document.getElementById('meu-player').src = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function abrirFilme(nome, url) {
            document.getElementById('catalogo').classList.add('hidden');
            document.getElementById('secao-filtros').classList.add('hidden');
            document.getElementById('painel-player').classList.remove('hidden');
            
            document.getElementById('titulo-player').innerText = 'Assistindo a: ' + nome;
            document.getElementById('meu-player').src = url;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Inicializa o catálogo puxando do TMDB ao carregar a página
        carregarCatalogo();
    </script>
</body>
</html>
