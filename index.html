<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricoflix</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Barra Superior -->
    <header class="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-6">
            <h1 onclick="carregarConteudo('movie')" class="text-2xl font-black text-cyan-400 tracking-wider cursor-pointer">Ricoflix</h1>
            <span class="text-xs bg-zinc-800 text-cyan-300 px-3 py-1 rounded-full border border-cyan-900">Dublado PT-BR</span>
        </div>
        <div class="relative w-72">
            <input type="text" id="input-busca" onkeypress="buscarNoTmdb(event)" placeholder="Pesquisar (aperte Enter)..." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 text-sm text-zinc-200 focus:outline-none focus:border-cyan-500">
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-6 flex flex-col gap-6">
        
        <!-- Filtros Profissionais -->
        <div id="secao-filtros" class="flex items-center justify-between flex-wrap gap-4">
            <div class="flex items-center gap-3">
                <button id="btn-filmes" onclick="carregarConteudo('movie')" class="filtro-btn bg-cyan-500 text-zinc-950 font-semibold px-5 py-2 rounded-full text-sm cursor-pointer transition-all">Filmes</button>
                <button id="btn-series" onclick="carregarConteudo('tv')" class="filtro-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-5 py-2 rounded-full text-sm border border-zinc-800 cursor-pointer transition-all">Séries</button>
            </div>
            <span class="text-xs text-zinc-500">Dica: Digite na busca e aperte Enter para achar qualquer título.</span>
        </div>

        <!-- Grade de Catálogo -->
        <div id="catalogo" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <!-- Carregando via JavaScript -->
        </div>

        <!-- Seção do Player -->
        <div id="painel-player" class="mt-4 flex flex-col gap-4 hidden">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
                    <h2 id="titulo-player" class="text-sm font-semibold text-zinc-300">Assistindo a: -</h2>
                </div>
                <span class="text-xs bg-zinc-900 border border-zinc-800 text-cyan-400 px-3 py-1 rounded-full font-bold">1080p HD Nativo</span>
            </div>

            <!-- Container do Iframe -->
            <div class="w-full bg-black rounded-xl overflow-hidden shadow-2xl border border-zinc-800" style="aspect-ratio: 16/9; position: relative;">
                <iframe id="meu-player" src="" 
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;" 
                        allowfullscreen="true" 
                        webkitallowfullscreen="true" 
                        mozallowfullscreen="true" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
                </iframe>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-zinc-900 border-t border-zinc-800 text-center py-4 text-xs text-zinc-500 mt-12">
        Ricoflix &copy; 2026 - Todos os direitos reservados
    </footer>

    <!-- Script Profissional -->
    <script>
        const API_KEY = '3cbe2c38513cc9d3266f2dc134ce9b29';
        const IMG_BASE_URL = 'https://image.tmdb.org/t/p/w342';
        let tipoAtual = 'movie'; // 'movie' ou 'tv'

        async function carregarConteudo(tipo) {
            tipoAtual = tipo;
            voltarHome();

            // Atualiza visual dos botões
            if (tipo === 'movie') {
                document.getElementById('btn-filmes').className = "filtro-btn bg-cyan-500 text-zinc-950 font-semibold px-5 py-2 rounded-full text-sm cursor-pointer transition-all";
                document.getElementById('btn-series').className = "filtro-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-5 py-2 rounded-full text-sm border border-zinc-800 cursor-pointer transition-all";
            } else {
                document.getElementById('btn-series').className = "filtro-btn bg-cyan-500 text-zinc-950 font-semibold px-5 py-2 rounded-full text-sm cursor-pointer transition-all";
                document.getElementById('btn-filmes').className = "filtro-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-5 py-2 rounded-full text-sm border border-zinc-800 cursor-pointer transition-all";
            }

            try {
                const resposta = await fetch(`https://api.themoviedb.org/3/${tipo}/popular?api_key=${API_KEY}&language=pt-BR`);
                const dados = await resposta.json();
                exibirCards(dados.results, tipo);
            } catch (erro) {
                console.error("Erro ao carregar catálogo:", erro);
            }
        }

        async function buscarNoTmdb(event) {
            if (event.key === 'Enter') {
                const termo = document.getElementById('input-busca').value.trim();
                if (!termo) return;

                try {
                    const resposta = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&language=pt-BR&query=${encodeURIComponent(termo)}`);
                    const dados = await resposta.json();
                    
                    // Filtra apenas filmes e séries válidos que tenham poster
                    const resultadosValidos = dados.results.filter(item => (item.media_type === 'movie' || item.media_type === 'tv') && item.poster_path);
                    
                    if (resultadosValidos.length > 0) {
                        exibirCards(resultadosValidos, 'multi');
                    } else {
                        alert("Nenhum resultado encontrado!");
                    }
                } catch (erro) {
                    console.error("Erro na busca:", erro);
                }
            }
        }

        function exibirCards(itens, modo) {
            const catalogo = document.getElementById('catalogo');
            catalogo.innerHTML = '';

            itens.forEach(item => {
                if (!item.poster_path) return;
                
                const tipoItem = modo === 'multi' ? item.media_type : modo;
                const titulo = item.title || item.name;
                const data = item.release_date || item.first_air_date || '2026';
                const ano = data.split('-')[0];
                const poster = IMG_BASE_URL + item.poster_path;
                
                // Monta a URL correta do player dependendo se é filme ou série
                const urlEmbed = tipoItem === 'tv' 
                    ? `https://vidsrc.xyz/embed/tv?tmdb=${item.id}` 
                    : `https://vidsrc.xyz/embed/movie?tmdb=${item.id}`;

                const labelTipo = tipoItem === 'tv' ? 'Série' : 'Filme';

                catalogo.innerHTML += `
                    <div onclick="abrirPlayer('${titulo.replace(/'/g, "\\'")}', '${urlEmbed}')" class="card-item bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden flex flex-col group cursor-pointer hover:border-cyan-500 transition-all">
                        <div class="aspect-[2/3] bg-zinc-800 relative overflow-hidden">
                            <img src="${poster}" alt="${titulo}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            <span class="absolute top-2 right-2 bg-cyan-950/80 border border-cyan-500/50 text-cyan-400 text-[10px] font-bold px-2 py-0.5 rounded">DUBLADO</span>
                        </div>
                        <div class="p-3 flex flex-col justify-between flex-1">
                            <h3 class="text-sm font-bold text-zinc-200 truncate">${titulo}</h3>
                            <div class="flex items-center justify-between text-xs text-zinc-400 mt-2">
                               <span>${ano}</span>
                               <span class="text-[10px] bg-zinc-800 px-2 py-0.5 rounded text-zinc-300">${labelTipo}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function voltarHome() {
            document.getElementById('painel-player').classList.add('hidden');
            document.getElementById('catalogo').classList.remove('hidden');
            document.getElementById('meu-player').src = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function abrirPlayer(nome, url) {
            document.getElementById('catalogo').classList.add('hidden');
            document.getElementById('painel-player').classList.remove('hidden');
            
            document.getElementById('titulo-player').innerText = 'Assistindo a: ' + nome;
            document.getElementById('meu-player').src = url;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Inicializa abrindo os filmes populares
        carregarConteudo('movie');
    </script>
</body>
</html>
