<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricoflix</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #0b0b0b; }
    </style>
</head>
<body class="bg-[#0b0b0b] text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-red-600 selection:text-white custom-scrollbar" x-data="ricoflixApp()" x-init="init()">

    <!-- HEADER -->
    <header class="fixed top-0 left-0 right-0 z-50 transition-all duration-500 bg-gradient-to-b from-black/90 via-black/50 to-transparent">
        <div class="flex items-center justify-between px-4 md:px-8 py-4">
            <div class="flex items-center gap-8">
                <h1 class="text-2xl md:text-3xl font-black text-red-600 tracking-wider cursor-pointer hover:scale-105 transition-transform" @click="currentPage = 'home'">
                    RICOFLIX
                </h1>
                <nav class="hidden md:flex items-center gap-6 text-sm font-medium tracking-wide text-zinc-300">
                    <a href="#" class="hover:text-white transition-colors">Início</a>
                    <a href="#" class="hover:text-white transition-colors">Filmes</a>
                    <a href="#" class="hover:text-white transition-colors">Séries</a>
                    <a href="#" class="hover:text-white transition-colors">Minha Lista</a>
                </nav>
            </div>
            
            <div class="flex items-center gap-4">
                <input 
                    type="text" 
                    placeholder="Títulos, gente e gêneros..." 
                    class="bg-white/10 border border-white/20 rounded-full px-4 py-2 text-sm text-white placeholder-zinc-400 outline-none focus:border-red-500 focus:bg-white/15 transition-all w-40 md:w-64"
                    x-model="searchQuery"
                >
                <div class="w-8 h-8 rounded bg-zinc-800 flex items-center justify-center cursor-pointer hover:bg-zinc-700 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-grow">
        
        <!-- Loading Global -->
        <div x-show="isLoading" class="fixed inset-0 z-[200] bg-[#0b0b0b] flex items-center justify-center">
            <div class="flex flex-col items-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-600 mb-4"></div>
                <p class="text-zinc-400">Carregando Ricoflix...</p>
            </div>
        </div>

        <!-- DESTAQUE (HERO) -->
        <section class="relative h-[75vh] w-full" x-show="!isLoading">
            <div class="absolute inset-0 bg-[url('https://image.tmdb.org/t/p/original/7WsyChQLEftFiDOVTGkv3hFpyyt.jpg')] bg-cover bg-center"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-[#0b0b0b] via-[#0b0b0b]/60 to-transparent"></div>
            
            <div class="absolute bottom-0 left-0 right-0 p-4 md:p-12 z-10 max-w-2xl">
                <span class="text-red-600 text-xs font-bold tracking-widest mb-2 block">DESTAQUE DO RICOFLIX</span>
                <h2 class="text-3xl md:text-5xl font-extrabold mb-3 leading-tight text-white">Dix pour cent: O Filme</h2>
                <p class="text-zinc-300 text-sm md:text-base mb-6 line-clamp-3 leading-relaxed">
                    Diante de uma série de contratempos em seu primeiro filme, Andréa pede ajuda à antiga equipe da agência ASK. Mas a turma acaba piorando ainda mais a situação.
                </p>
                <div class="flex gap-3">
                    <button @click="openPlayer({ id: 1, title: 'Dix pour cent: O Filme', type: 'movie' })" class="bg-white text-black font-bold py-2.5 px-6 rounded hover:bg-zinc-200 transition-colors flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg>
                        Assistir
                    </button>
                    <button class="bg-zinc-600/70 text-white font-bold py-2.5 px-6 rounded hover:bg-zinc-600 transition-colors flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" /></svg>
                        Mais Informações
                    </button>
                </div>
            </div>
        </section>

        <!-- SEÇÃO: FILMES POPULARES -->
        <section class="px-4 md:px-8 -mt-10 relative z-20 pb-10" x-show="!isLoading">
            <h3 class="text-xl font-bold mb-4 text-white">Filmes Populares</h3>
            
            <div class="flex gap-4 overflow-x-auto pb-4 scrollbar-hide snap-x">
                <template x-for="movie in popularMovies" :key="movie.id">
                    <div class="flex-none w-[140px] md:w-[160px] relative group cursor-pointer snap-start" @click="openPlayer(movie)">
                        <div class="relative rounded-lg overflow-hidden transition-transform duration-300 group-hover:scale-105 group-hover:z-10 shadow-lg">
                            <img :src="getImageUrl(movie.poster_path)" :alt="movie.title" class="w-full h-[210px] md:h-[240px] object-cover bg-zinc-800">
                            <div class="absolute top-2 left-2 bg-black/60 rounded-full w-8 h-8 flex items-center justify-center backdrop-blur-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                                </svg>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </section>
    </main>

    <!-- MODAL DO PLAYER -->
    <div 
        x-show="isPlayerOpen" 
        x-transition.opacity
        class="fixed inset-0 z-[100] flex items-center justify-center bg-black/95 backdrop-blur-sm p-4"
        style="display: none;"
    >
        <div class="relative w-full max-w-5xl bg-black rounded-xl overflow-hidden shadow-2xl border border-zinc-800">
            
            <button @click="closePlayer()" class="absolute top-4 right-4 z-30 bg-red-600 hover:bg-red-700 text-white rounded-full p-2 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>

            <div class="absolute top-0 left-0 w-full p-4 bg-gradient-to-b from-black/90 to-transparent z-20 pointer-events-none">
                <h2 class="text-white font-bold text-lg pl-2" x-text="currentMovie ? currentMovie.title : 'Carregando...'"></h2>
            </div>

            <div class="relative w-full aspect-video bg-zinc-900 flex items-center justify-center">
                <iframe 
                    id="video-player-iframe"
                    class="w-full h-full border-0 absolute inset-0 z-0"
                    allowfullscreen
                    @load="onIframeLoad()"
                ></iframe>

                <!-- Overlay de Status -->
                <div x-show="playerStatus !== 'ready'" class="absolute inset-0 z-10 flex flex-col items-center justify-center bg-black/80 text-center p-6">
                    
                    <template x-if="playerStatus === 'loading'">
                        <div class="flex flex-col items-center">
                            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-600 mb-4"></div>
                            <p class="text-zinc-400 text-sm">Conectando à RedeFlixApi...</p>
                        </div>
                    </template>

                    <template x-if="playerStatus === 'error'">
                        <div class="flex flex-col items-center">
                            <svg class="h-12 w-12 text-red-500 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                            </svg>
                            <h3 class="text-white font-bold text-lg mb-1">Conteúdo não encontrado</h3>
                            <p class="text-zinc-400 text-sm">Trocando para o próximo servidor...</p>
                        </div>
                    </template>

                    <template x-if="playerStatus === 'fatal_error'">
                        <div class="flex flex-col items-center">
                            <h3 class="text-red-500 font-bold text-xl mb-2">Erro Crítico</h3>
                            <p class="text-zinc-400 mb-4">A RedeFlixApi não respondeu. Tente novamente.</p>
                            <button @click="loadServer(0)" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded transition-colors">
                                Tentar Novamente
                            </button>
                        </div>
                    </template>
                </div>
            </div>
            
            <div class="bg-zinc-900 p-3 flex gap-2 justify-center border-t border-zinc-800">
                <template x-for="(server, index) in servers" :key="index">
                    <button 
                        @click="currentServerIndex = index; loadServer(index)"
                        class="px-4 py-1.5 rounded text-xs font-bold transition-colors"
                        :class="currentServerIndex === index ? 'bg-red-600 text-white' : 'bg-zinc-800 text-zinc-400 hover:bg-zinc-700'"
                        x-text="server.name"
                    ></button>
                </template>
            </div>
        </div>
    </div>

    <!-- SCRIPT PRINCIPAL -->
    <script>
        function ricoflixApp() {
            return {
                currentPage: 'home',
                searchQuery: '',
                isLoading: true,
                errorMsg: '',
                
                // SUA CHAVE API DO TMDB
                tmdbApiKey: '3cbe2c38513cc9d3266f2dc134ce9b29', 
                popularMovies: [],
                
                isPlayerOpen: false,
                currentMovie: null,
                currentServerIndex: 0,
                playerStatus: 'loading', 
                fallbackTimer: null,
                
                // --- SERVIDORES DE PRODUÇÃO (REDEFLIX API) ---
                // Para adicionar um servidor de backup, basta adicionar um novo objeto nesta lista.
                // O sistema tentará o primeiro, se falhar, vai para o próximo.
                servers: [
                    { name: "Servidor 1 (RedeFlix)", baseUrl: "https://redeflixapi.store" },
                    { name: "Servidor 2 (Backup)", baseUrl: "https://redeflixapi.store" } // Exemplo: se você tiver uma API de backup, troque a baseUrl
                ],

                async init() {
                    await this.fetchTMDBData();
                    this.isLoading = false;
                },

                async fetchTMDBData() {
                    try {
                        const res = await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${this.tmdbApiKey}&language=pt-BR&page=1`);
                        const data = await res.json();
                        if (data.results) {
                            this.popularMovies = data.results;
                        } else {
                            console.error("Erro na API TMDB:", data);
                            this.errorMsg = "Chave de API inválida ou limite excedido.";
                        }
                    } catch (error) {
                        console.error("Erro de rede:", error);
                        this.errorMsg = "Falha ao conectar com o TMDB.";
                    }
                },

                getImageUrl(path, size = 'w500') {
                    if (!path) return 'https://via.placeholder.com/300x450/333/fff?text=Sem+Imagem';
                    return `https://image.tmdb.org/t/p/${size}${path}`;
                },

                // --- FUNÇÃO INTELIGENTE QUE MONTA A URL DA REDEFLIX API ---
                getServerUrl(server, movie) {
                    if (!movie || !movie.id) return server.baseUrl;

                    // Se for um Filme
                    if (movie.type === 'movie' || !movie.type) {
                        return `${server.baseUrl}/filme/${movie.id}`;
                    }
                    
                    // Se for uma Série (com temporada e episódio)
                    if (movie.type === 'tv') {
                        const season = movie.season || 1;
                        const episode = movie.episode || 1;
                        return `${server.baseUrl}/serie/${movie.id}/${season}/${episode}`;
                    }

                    return server.baseUrl;
                },

                openPlayer(movie) {
                    this.currentMovie = movie;
                    this.isPlayerOpen = true;
                    this.currentServerIndex = 0;
                    this.playerStatus = 'loading';
                    this.loadServer(0);
                },

                closePlayer() {
                    this.isPlayerOpen = false;
                    this.currentMovie = null;
                    this.playerStatus = 'loading';
                    if (this.fallbackTimer) clearTimeout(this.fallbackTimer);
                    const iframe = document.getElementById('video-player-iframe');
                    if (iframe) iframe.src = "";
                },

                loadServer(index) {
                    const server = this.servers[index];
                    if (!server) {
                        this.playerStatus = 'fatal_error';
                        return;
                    }

                    this.playerStatus = 'loading';
                    const iframe = document.getElementById('video-player-iframe');
                    
                    // Monta a URL real da RedeFlixApi
                    const finalUrl = this.getServerUrl(server, this.currentMovie);
                    console.log(`[Ricoflix] Carregando: ${server.name} -> ${finalUrl}`);
                    
                    iframe.src = finalUrl; 

                    // ==========================================
                    // O BUGFIX: TIMEOUT DE FALLBACK
                    // ==========================================
                    if (this.fallbackTimer) clearTimeout(this.fallbackTimer);
                    
                    // Aumentei para 8 segundos, pois APIs reais podem demorar um pouco mais
                    this.fallbackTimer = setTimeout(() => {
                        console.log(`[ERRO] ${server.name} não respondeu a tempo. Tentando próximo...`);
                        this.playerStatus = 'error';
                        
                        const nextIndex = index + 1;
                        if (nextIndex < this.servers.length) {
                            setTimeout(() => {
                                this.currentServerIndex = nextIndex;
                                this.loadServer(nextIndex);
                            }, 1500);
                        } else {
                            this.playerStatus = 'fatal_error';
                        }
                    }, 8000); // 8 segundos
                },

                onIframeLoad() {
                    // Se o iframe carregou, cancela o timeout de erro
                    if (this.fallbackTimer) clearTimeout(this.fallbackTimer);
                    this.playerStatus = 'ready';
                }
            }
        }
    </script>
</body>
</html>
