<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ricoflix — Dublado PT-BR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { background: #0a0a0a; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #e0e0e0; min-height: 100vh; }
        
        .card { width: 200px; background: #111; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.04); transition: all 0.3s; cursor: pointer; flex-shrink: 0; }
        .card:hover { transform: translateY(-4px) scale(1.01); border-color: #00E5FF; }
        .card .poster-wrapper { position: relative; width: 100%; height: 280px; background: #0a0a0a; overflow: hidden; }
        .card .poster-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card .info { padding: 0.9rem; }
        .card .info h3 { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #eef4ff; }
        .card .info .year { font-size: 0.75rem; color: #6688aa; }
        .card .badge-type { font-size: 0.6rem; background: rgba(0,229,255,0.06); border: 1px solid rgba(0,229,255,0.08); padding: 0.15rem 0.7rem; border-radius: 40px; color: #88ccff; }
        
        .scroll { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 1.2rem; padding: 0.8rem 0.2rem 2rem 0.2rem; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .scroll > * { flex: 0 0 auto; scroll-snap-align: start; }
        
        .logo { font-size: 1.6rem; font-weight: 700; color: #00E5FF; letter-spacing: -0.5px; }
        
        .btn { background: rgba(0,229,255,0.04); border: 1px solid rgba(0,229,255,0.12); color: #00E5FF; padding: 0.5rem 1.4rem; border-radius: 60px; font-weight: 500; transition: all 0.3s; }
        .btn:hover { background: rgba(0,229,255,0.08); border-color: #00E5FF; }
        
        .search { background: rgba(0,0,0,0.7); border: 1px solid rgba(0,229,255,0.12); border-radius: 60px; padding: 0.5rem 1.2rem 0.5rem 2.8rem; color: #f0f0f0; width: 260px; transition: all 0.3s; }
        .search:focus { outline: none; border-color: #00E5FF; }
        .search::placeholder { color: #556677; }
        
        .tab { background: transparent; border: 1px solid rgba(255,255,255,0.06); border-radius: 40px; padding: 0.5rem 1.2rem; color: #8899aa; transition: all 0.25s; cursor: pointer; }
        .tab.active { background: rgba(0,229,255,0.06); border-color: #00E5FF; color: #00E5FF; }
        
        .loader { border: 2px solid rgba(0,229,255,0.05); border-top: 2px solid #00E5FF; border-radius: 50%; width: 36px; height: 36px; animation: spin 0.9s linear infinite; margin: 2rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #player-container { background: #0a0a0a; border-radius: 24px; overflow: hidden; border: 1px solid rgba(0,229,255,0.06); min-height: 420px; }
        #player-container iframe { width: 100%; height: 420px; border: none; background: #000; display: block; }
        
        .placeholder { display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 3rem; text-align: center; color: #445566; }
        .placeholder i { font-size: 3rem; color: #00E5FF; margin-bottom: 1rem; }
        .placeholder .title { color: #eef4ff; font-size: 1.2rem; font-weight: 600; }
        
        .source-selector { background: rgba(0,0,0,0.7); border: 1px solid rgba(0,229,255,0.12); border-radius: 40px; padding: 0.4rem 1rem; color: #aabbdd; font-size: 0.8rem; cursor: pointer; min-width: 150px; }
        .source-selector option { background: #0a0a0a; color: #e0e0e0; }
        
        @media (max-width: 640px) { .card { width: 160px; } .card .poster-wrapper { height: 220px; } .search { width: 180px; } #player-container iframe { height: 280px; } }
    </style>
</head>
<body class="antialiased p-4 md:p-6 max-w-7xl mx-auto" x-data="app()" x-init="init()">

    <header class="flex flex-wrap items-center justify-between gap-4 mb-6">
        <div class="flex items-center gap-3">
            <span class="logo">Ricoflix</span>
            <span class="hidden sm:inline text-[10px] text-[#445566] bg-black/60 px-3 py-1 rounded-full border border-[#00E5FF]/10">
                Dublado
            </span>
        </div>
        <div class="flex items-center gap-3 flex-wrap">
            <div class="relative">
                <i class="lucide-search" style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:#445566;width:16px;height:16px;"></i>
                <input type="text" id="searchInput" placeholder="Buscar filmes..." class="search pl-10 pr-4 py-2" x-model="searchQuery" @keyup.enter="performSearch()" />
            </div>
            <button class="btn" @click="performSearch()">Ir</button>
        </div>
    </header>

    <div class="flex flex-wrap items-center gap-3 mb-6 border-b border-[#00E5FF]/5 pb-3">
        <span class="tab" :class="{ active: currentFilter === 'all' }" @click="setFilter('all')">Tudo</span>
        <span class="tab" :class="{ active: currentFilter === 'movie' }" @click="setFilter('movie')">Filmes</span>
        <span class="tab" :class="{ active: currentFilter === 'tv' }" @click="setFilter('tv')">Séries</span>
        <span class="ml-auto text-[10px] text-[#445566]">
            Dublado PT-BR
        </span>
    </div>

    <section class="mb-6">
        <div class="scroll" id="movieGrid">
            <template x-for="movie in filteredMovies" :key="movie.id">
                <div class="card" @click="loadMovie(movie)">
                    <div class="poster-wrapper">
                        <img :src="movie.poster || 'https://via.placeholder.com/342x513/0a0a0a/334455?text=404'" :alt="movie.title" loading="lazy" />
                        <div style="position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.8);padding:0.2rem 0.6rem;border-radius:40px;border:1px solid rgba(0,229,255,0.2);">
                            <span style="font-size:0.5rem;color:#00E5FF;">DUB</span>
                        </div>
                    </div>
                    <div class="info">
                        <div class="flex justify-between items-start">
                            <h3 x-text="movie.title"></h3>
                        </div>
                        <div class="flex justify-between items-center mt-1">
                            <span class="year" x-text="movie.year"></span>
                            <span class="badge-type" x-text="movie.type === 'tv' ? 'Série' : 'Filme'"></span>
                        </div>
                    </div>
                </div>
            </template>
        </div>
        <div id="loaderGrid" class="flex justify-center py-8" x-show="loading">
            <div class="loader"></div>
        </div>
        <p class="text-center text-[#445566] py-6 hidden" id="noResults">Nenhum título encontrado.</p>
    </section>

    <section id="player-section" class="mt-6">
        <div id="player-container">
            <div class="placeholder" id="fallbackMessage" x-show="!currentMovie">
                <i class="lucide-film" style="font-size:3rem;color:#00E5FF;margin-bottom:1rem;display:block;"></i>
                <div class="title">Selecione um filme</div>
                <div class="sub" style="color:#445566;margin-top:0.5rem;">Clique em um card para assistir</div>
            </div>
            <iframe id="playerIframe" src="about:blank" allowfullscreen="true" allow="autoplay; encrypted-media; picture-in-picture" style="display:none;" x-show="currentMovie"></iframe>
        </div>
        <div class="flex flex-wrap justify-between items-center mt-3 text-sm text-[#556677] px-1 gap-2">
            <span class="player-title" id="movieTitlePlayer">
                <i class="lucide-play-circle" style="color:#00E5FF;width:16px;height:16px;display:inline-block;vertical-align:middle;margin-right:0.5rem;"></i>
                <strong x-text="currentMovie ? currentMovie.title : 'Selecione um filme'"></strong>
                <span class="text-[#445566] text-xs ml-2" x-show="currentMovie" x-text="'Fonte: ' + currentSource"></span>
            </span>
            <div class="flex items-center gap-2">
                <span class="text-[10px] text-[#445566]">Fonte:</span>
                <select id="sourceSelector" class="source-selector" x-model="currentSourceKey" @change="changeSource()">
                    <option value="multiembed">MultiEmbed</option>
                    <option value="vidsrc">VidSrc</option>
                    <option value="superembed">SuperEmbed</option>
                </select>
            </div>
        </div>
    </section>

    <script>
    function app() {
        return {
            catalog: [],
            currentFilter: 'all',
            searchQuery: '',
            currentMovie: null,
            currentSourceKey: 'multiembed',
            currentSource: 'MultiEmbed',
            loading: true,

            get filteredMovies() {
                let filtered = [...this.catalog];
                if (this.currentFilter === 'movie') {
                    filtered = filtered.filter(m => m.type === 'movie');
                } else if (this.currentFilter === 'tv') {
                    filtered = filtered.filter(m => m.type === 'tv');
                }
                if (this.searchQuery.trim()) {
                    const q = this.searchQuery.toLowerCase();
                    filtered = filtered.filter(m => m.title.toLowerCase().includes(q));
                }
                return filtered;
            },

            async init() {
                await this.loadCatalog();
            },

            async loadCatalog() {
                this.loading = true;
                this.catalog = await this.fetchMovies();
                this.loading = false;
            },

            async fetchMovies() {
                const TMDB_API_KEY = 'ebea8cfca72fdff8d2624ad7bbf78e4c';
                const IMG_BASE = 'https://image.tmdb.org/t/p/w342';
                const MOVIE_IDS = ['939243', '533535', '1022789', '872585', '693134', '603692'];

                try {
                    const movies = await Promise.all(
                        MOVIE_IDS.map(async (id) => {
                            const response = await fetch(
                                `https://api.themoviedb.org/3/movie/${id}?api_key=${TMDB_API_KEY}&language=pt-BR`
                            );
                            if (!response.ok) return null;
                            const data = await response.json();
                            return {
                                id: data.id,
                                title: data.title,
                                year: data.release_date ? data.release_date.slice(0,4) : '2026',
                                poster: data.poster_path ? `${IMG_BASE}${data.poster_path}` : null,
                                type: 'movie',
                                overview: data.overview || ''
                            };
                        })
                    );
                    return movies.filter(m => m !== null);
                } catch (error) {
                    console.warn('Erro ao buscar TMDB:', error);
                    return [
                        { id: '939243', title: 'Sonic 3', year: '2024', poster: 'https://image.tmdb.org/t/p/w342/d8Ryb8AunYAuycVKDp5HpdWPKgV.jpg', type: 'movie' },
                        { id: '533535', title: 'Deadpool 3', year: '2024', poster: 'https://image.tmdb.org/t/p/w342/8cdWjvZQUDoUYc5uQQj9DmxyiXJ.jpg', type: 'movie' },
                        { id: '1022789', title: 'Divertida Mente 2', year: '2024', poster: 'https://image.tmdb.org/t/p/w342/p6H8b1cGfEo9fKbCw8jG0s3nGxM.jpg', type: 'movie' },
                        { id: '872585', title: 'Oppenheimer', year: '2023', poster: 'https://image.tmdb.org/t/p/w342/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg', type: 'movie' },
                        { id: '693134', title: 'Duna: Parte 2', year: '2024', poster: 'https://image.tmdb.org/t/p/w342/8b8R8l88Qje9dn9OE8PY05Nxl1X.jpg', type: 'movie' },
                        { id: '603692', title: 'John Wick 4', year: '2023', poster: 'https://image.tmdb.org/t/p/w342/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg', type: 'movie' }
                    ];
                }
            },

            getSourceUrl(movieId, sourceKey) {
                const sources = {
                    'multiembed': `https://multiembed.mov/?video_id=${movieId}&tmdb=1&lang=pt`,
                    'vidsrc': `https://vidsrc.xyz/embed/movie/${movieId}?lang=pt`,
                    'superembed': `https://superembed.stream/movie/${movieId}?lang=pt`
                };
                return sources[sourceKey] || sources['multiembed'];
            },

            loadMovie(movie) {
                this.currentMovie = movie;
                const url = this.getSourceUrl(movie.id, this.currentSourceKey);
                const iframe = document.getElementById('playerIframe');
                const placeholder = document.getElementById('fallbackMessage');
                
                placeholder.style.display = 'none';
                iframe.style.display = 'block';
                iframe.src = url;
                
                const sourceNames = { 'multiembed': 'MultiEmbed', 'vidsrc': 'VidSrc', 'superembed': 'SuperEmbed' };
                this.currentSource = sourceNames[this.currentSourceKey] || 'MultiEmbed';
                
                document.getElementById('player-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
            },

            changeSource() {
                if (this.currentMovie) {
                    this.loadMovie(this.currentMovie);
                }
            },

            setFilter(filter) {
                this.currentFilter = filter;
                this.searchQuery = '';
            },

            performSearch() {
                // Alpine.js já faz o filtro automaticamente via computed property
            }
        }
    }
    </script>

    <footer class="mt-12 pt-6 border-t border-[#00E5FF]/5 text-[10px] text-[#334455] flex justify-between items-center">
        <span>© 2026 Ricoflix · Dublado PT-BR</span>
        <span>Com TMDB</span>
    </footer>
</body>
</html>
