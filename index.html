<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricoflix</title>
    <!-- Aqui entra o restante do cabeçalho, estilos e estrutura do seu index.html original -->
</head>
<body>

    <!-- Sua interface original do Ricoflix continua intacta aqui embaixo -->

    <script>
        // Função atualizada para reproduzir Séries usando a RedeflixAPI
        function reproduzirEpisodioSerie(temporada, episodio, nomeEpisodio) {
            document.getElementById('header-principal').classList.add('hidden');
            document.getElementById('footer-principal').classList.add('hidden');
            document.getElementById('painel-detalhes').classList.add('hidden');
            document.getElementById('painel-player').classList.remove('hidden');
            
            document.getElementById('titulo-player').innerText = `Assistindo a: ${itemAtualCache.titulo} - T${temporada}:E${episodio} (${nomeEpisodio})`;
            
            // Rota oficial da RedeflixAPI para Séries
            document.getElementById('meu-player').src = `https://redeflixapi.store/serie/${itemAtualCache.id}/${temporada}/${episodio}`;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Função atualizada para reproduzir Filmes usando a RedeflixAPI
        function reproduzirFilme(idFilme) {
            document.getElementById('header-principal').classList.add('hidden');
            document.getElementById('footer-principal').classList.add('hidden');
            document.getElementById('painel-detalhes').classList.add('hidden');
            document.getElementById('painel-player').classList.remove('hidden');
            
            // Rota oficial da RedeflixAPI para Filmes
            document.getElementById('meu-player').src = `https://redeflixapi.store/filme/${idFilme}`;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function voltarParaDetalhes() {
            document.getElementById('painel-player').classList.add('hidden');
            document.getElementById('meu-player').src = '';
            document.getElementById('header-principal').classList.remove('hidden');
            document.getElementById('footer-principal').classList.remove('hidden');
        }
    </script>
</body>
</html>
