<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricoflix - Assistir Sonic 3</title>
    <style>
        /* CSS - Estilização igual ao site */
        body {
            background-color: #0f0f0f;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 20px; }

        .player-container {
            width: 100%;
            max-width: 1000px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
        }

        /* A área onde o filme aparece */
        #video-area {
            width: 100%;
            aspect-ratio: 16 / 9; /* Mantém proporção de vídeo */
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Estilo dos botões de canais */
        .player-controls {
            background-color: #1a1a1a;
            padding: 15px;
            text-align: center;
            border-top: 2px solid #333;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            background-color: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .tab-btn.active {
            background-color: #006400; /* Verde escuro */
            border-color: #00ff00;
        }

        .channel-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .channel-btn {
            background-color: #006400;
            border: 1px solid #00ff00;
            color: #fff;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .channel-btn:hover {
            background-color: #008000;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Assistir Sonic 3: O Filme</h1>

    <!-- O Player -->
    <div class="player-container">
        <div id="video-area">
            <!-- O vídeo será injetado aqui pelo JavaScript -->
            <p style="color: #555;">Escolha um canal para começar</p>
        </div>

        <div class="player-controls">
            <!-- Abas Dublado/Legendado -->
            <div class="tabs">
                <button class="tab-btn active" onclick="mudarIdioma('dublado')">DUBLADO</button>
                <button class="tab-btn" onclick="mudarIdioma('legendado')">LEGENDADO</button>
            </div>

            <!-- Botões de Canal -->
            <div class="channel-buttons">
                <button class="channel-btn" onclick="trocarVideo('1')">▶ Canal 1</button>
                <button class="channel-btn" onclick="trocarVideo('2')">▶ Canal 2</button>
                <button class="channel-btn" onclick="trocarVideo('3')">▶ Canal 3</button>
            </div>
        </div>
    </div>

    <script>
        // ID do filme Sonic 3 no IMDB
        const IMDB_ID = 'tt18259086';
        
        // Função para trocar o idioma (visual apenas, mas mantém o mesmo link por enquanto)
        function mudarIdioma(idioma) {
            // Aqui você poderia trocar o link se tiver versões dubladas ou legendadas diferentes
            alert("Você selecionou: " + idioma.toUpperCase());
        }

        // A FUNÇÃO PRINCIPAL: Troca o vídeo na tela
        function trocarVideo(canal) {
            const videoArea = document.getElementById('video-area');
            
            // Deixa a tela preta e mostra "Carregando"
            videoArea.innerHTML = '<p style="color: #fff;">Carregando Canal ' + canal + '...</p>';

            // Lógica para pegar o link correto dependendo do canal
            // Aqui você coloca os links que achou no Inspecionar!
            let linkDoVideo = '';

            if (canal === '1') {
                linkDoVideo = 'https://vidsrc.me/embed/movie?tt18259086'; // Link mais estável
            } else if (canal === '2') {
                linkDoVideo = 'https://vidsrc.to/embed/movie/tt18259086'; // Link alternativo
            } else {
                linkDoVideo = 'https://embed.su/embed/movie/tt18259086'; // Link reserva
            }

            // Injeta o Iframe na tela
            videoArea.innerHTML = `
                <iframe 
                    src="${linkDoVideo}" 
                    frameborder="0" 
                    allow="autoplay; encrypted-media; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
        }
    </script>

</body>
</html>
