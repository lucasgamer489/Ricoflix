<!DOCTYPE html>
<html lang="pt-BR" class="bg-[#141414]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricoflix</title>
    
    <!-- Garante fundo escuro imediato para evitar tela branca -->
    <style>
        * { box-sizing: border-box; }
        html, body {
            background-color: #141414 !important;
            color: #e5e5e5 !important;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* Esconde barra de rolagem lateral nos carrosséis mas mantém funcional */
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <!-- Tailwind CSS v3 Estável -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#141414] text-zinc-100 min-h-screen flex flex-col selection:bg-red-600 selection:text-white">

    <!-- CABEÇALHO -->
    <header class="w-full bg-gradient-to-b from-black/90 to-transparent py-4 px-6 md:px-12 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-8">
            <h1 onclick="voltarInicio()" class="text-red-600 font-extrabold text-2xl md:text-3xl tracking-wider cursor-pointer">RICOFLIX</h1>
            <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-zinc-300">
                <button onclick="voltarInicio()" class="hover:text-white transition">Início</button>
                <button onclick="carregarPorCategoria('movie', 'Filmes')" class="hover:text-white transition">Filmes</button>
                <button onclick="carregarPorCategoria('tv', 'Séries')" class="hover:text-white transition">Séries</button>
                <button onclick="abrirMinhaLista()" class="hover:text-white transition">Minha Lista</button>
            </nav>
        </div>
        <!-- BARRA DE PESQUISA -->
        <div class="relative">
            <input type="text" id="input-busca" placeholder="Pesquisar títulos..." onkeypress="if(event.key === 'Enter') realizarBusca()" class="bg-black/60 border border-zinc-700 text-sm rounded-full px-4 py-1.5 pl-9 text-white placeholder-zinc-400 focus:outline-none focus:border-white transition w-48 sm:w-64">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-zinc-400 absolute left-3 top-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-grow px-6 md:px-12 py-6 flex flex-col gap-8 max-w-7xl mx-auto w-full">
        
        <!-- SEÇÃO DE RESULTADOS / BUSCA / CATEGORIAS -->
        <div id="secao-dinamica" class="hidden flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <h2 id="titulo-secao" class="text-xl md:text-2xl font-bold text-white">Resultados</h2>
                <button onclick="voltarInicio()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs md:text-sm px-4 py-2 rounded transition border border-zinc-700">
                    ← Voltar para o Início
                </button>
            </div>
            <div id="catalogo-grade" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6 mt-2 w-full">
                <!-- Cards inseridos via JavaScript -->
            </div>
        </div>

        <!-- TELA INICIAL (DESTAQUE + CARROSSEIS) -->
        <div id="secao-inicial" class="flex flex-col gap-10">
            <!-- DESTAQUE PRINCIPAL -->
            <section id="banner-destaque" class="relative bg-zinc-900 border border-zinc-800 rounded-2xl p-6 md:p-10 flex flex-col md:flex-row items-center justify-between gap-6 shadow-2xl overflow-hidden">
                <div class="space-y-3 text-center md:text-left z-10 max-w-xl">
                    <span class="text-xs uppercase tracking-widest text-red-500 font-bold bg-red-500/10 px-3 py-1 rounded-full border border-red-500/20">Destaque do Ricoflix</span>
                    <h2 id="banner-titulo" class="text-2xl md:text-4xl font-extrabold text-white">Carregando...</h2>
                    <p id="banner-descricao" class="text-xs md:text-sm text-zinc-400 line-clamp-3">Aproveite seus filmes e séries favoritos.</p>
                    <div class="flex items-center justify-center md:justify-start gap-3 pt-2">
                        <button id="banner-btn-assistir" class="bg-white text-black font-semibold px-5 py-2.5 rounded hover:bg-zinc-200 transition flex items-center gap-2 shadow text-sm">
                            ▶ Assistir
                        </button>
                        <button id="banner-btn-info" class="bg-zinc-800/80 text-white font-semibold px-5 py-2.5 rounded hover:bg-zinc-700 transition border border-zinc-700 text-sm">
                            ℹ Mais Informações
                        </button>
                    </div>
                </div>
            </section>

            <!-- CARROSSEIS -->
            <div id="container-carrosseis" class="flex flex-col gap-8">
                <!-- Carrosséis injetados via JS -->
            </div>
        </div>

    </main>

    <!-- RODAPÉ -->
    <footer class="w-full py-6 text-center text-xs text-zinc-500 border-t border-zinc-900 mt-auto">
        Ricoflix &copy; 2026 - Inspirado na Netflix
    </footer>

    <!-- SCRIPT DE INTEGRAÇÃO TMDB -->
    <script>
        const API_KEY = 'cebbef0a02fdb853d9e05f66185fb876'; 
        const IMG_BASE_URL = 'https://image.tmdb.org/t/p/w500';
        const FALLBACK_IMG = 'https://images.unsplash.com/photo-1594909122845-11baa439b7bf?w=500&auto=format&fit=crop&q=60';

        document.addEventListener("DOMContentLoaded", () => {
            carregarPaginaInicial();
        });

        function obterMinhaLista() {
            try {
                return JSON.parse(localStorage.getItem('ricoflix_lista')) || [];
            } catch {
                return [];
            }
        }

        async function carregarPaginaInicial() {
            document.getElementById('secao-dinamica').classList.add('hidden');
            document.getElementById('secao-inicial').classList.remove('hidden');
            
            const container = document.getElementById('container-carrosseis');
            container.innerHTML = '';

            // Carrega Destaque (Filmes Populares)
            try {
                const res = await fetch(`https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}&language=pt-BR`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    const destaque = data.results[0];
                    document.getElementById('banner-titulo').innerText = destaque.title || destaque.name;
                    document.getElementById('banner-descricao').innerText = destaque.overview || "Sem descrição disponível.";
                    document.getElementById('banner-btn-assistir').onclick = () => abrirDetalhes(destaques.id, destaque.media_type || 'movie');
                    document.getElementById('banner-btn-info').onclick = () => abrirDetalhes(destaque.id, destaque.media_type || 'movie');
                    
                    if (destaque.backdrop_path) {
                        document.getElementById('banner-destaque').style.backgroundImage = `linear-gradient(to right, rgba(20,20,20,0.95) 40%, rgba(20,20,20,0.4)), url('https://image.tmdb.org/t/p/original${destaque.backdrop_path}')`;
                        document.getElementById('banner-destaque').style.backgroundSize = 'cover';
                        document.getElementById('banner-destaque').style.backgroundPosition = 'center';
                    }
                }
            } catch(e) { console.error(e); }

            // Carrega Carrosséis
            await criarCarrossel('Filmes Populares', `https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=pt-BR`, 'movie');
            await criarCarrossel('Séries Populares', `https://api.themoviedb.org/3/tv/popular?api_key=${API_KEY}&language=pt-BR`, 'tv');
            await criarCarrossel('Mais Bem Avaliados', `https://api.themoviedb.org/3/movie/top_rated?api_key=${API_KEY}&language=pt-BR`, 'movie');
        }

        async function criarCarrossel(tituloCarrossel, urlApi, tipoPadrao) {
            try {
                const res = await fetch(urlApi);
                const dados = await res.json();
                if (!dados.results || dados.results.length === 0) return;

                const container = document.getElementById('container-carrosseis');
                let cardsHtml = '';
                const favoritos = obterMinhaLista();

                dados.results.forEach(item => {
                    const tipo = item.media_type || tipoPadrao;
                    const titulo = item.title || item.name;
                    const dataStr = item.release_date || item.first_air_date || '2026';
                    const ano = dataStr.split('-')[0];
                    // CORREÇÃO: Se não houver poster_path, usa a imagem padrão bonita em vez de quebrar
                    const poster = item.poster_path ? (IMG_BASE_URL + item.poster_path) : FALLBACK_IMG;
                    const isFavorito = favoritos.some(f => f.id === item.id);

                    cardsHtml += `
                        <div onclick="abrirDetalhes(${item.id}, '${tipo}')" class="flex-none w-32 sm:w-40 md:w-52 group cursor-pointer relative transition-transform duration-300 hover:scale-105 hover:z-30">
                            <div class="aspect-[2/3] bg-zinc-900 rounded-lg overflow-hidden shadow-md relative border border-transparent hover:border-zinc-500">
                                <img src="${poster}" alt="${titulo}" class="w-full h-full object-cover" loading="lazy">
                            </div>
                            <h4 class="text-xs font-semibold text-zinc-300 mt-2 truncate group-hover:text-white">${titulo}</h4>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="flex flex-col gap-3">
                        <h3 class="text-sm md:text-lg font-bold text-zinc-100 tracking-wide">${tituloCarrossel}</h3>
                        <div class="flex items-center gap-3 overflow-x-auto scrollbar-none pb-4 pt-1">
                            ${cardsHtml}
                        </div>
                    </div>
                `;
            } catch (e) {
                console.error("Erro carrossel:", e);
            }
        }

        async function realizarBusca() {
            const query = document.getElementById('input-busca').value.trim();
            if (!query) return;

            document.getElementById('secao-inicial').classList.add('hidden');
            document.getElementById('secao-dinamica').classList.remove('hidden');
            document.getElementById('titulo-secao').innerText = `Resultados para: "${query}"`;

            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&language=pt-BR&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                const itensValidos = (data.results || []).filter(item => item.media_type === 'movie' || item.media_type === 'tv');
                
                exibirGradeCards(itensValidos, 'movie');
            } catch (e) {
                console.error(e);
            }
        }

        function exibirGradeCards(itens, tipoPadrao) {
            const grade = document.getElementById('catalogo-grade');
            grade.innerHTML = '';

            if (itens.length === 0) {
                grade.innerHTML = `<p class="text-zinc-400 text-sm col-span-full">Nenhum resultado encontrado.</p>`;
                return;
            }

            itens.forEach(item => {
                const tipo = item.media_type || tipoPadrao;
                const titulo = item.title || item.name;
                // CORREÇÃO: Trata cards sem imagem na busca exibindo o fallback bonito
                const poster = item.poster_path ? (IMG_BASE_URL + item.poster_path) : FALLBACK_IMG;

                grade.innerHTML += `
                    <div onclick="abrirDetalhes(${item.id}, '${tipo}')" class="flex flex-col group cursor-pointer relative hover:scale-105 transition-transform duration-300">
                        <div class="aspect-[2/3] bg-zinc-900 rounded-lg overflow-hidden shadow-lg relative border border-zinc-800">
                            <img src="${poster}" alt="${titulo}" class="w-full h-full object-cover" loading="lazy">
                        </div>
                        <h4 class="text-xs font-semibold text-zinc-300 mt-2 truncate group-hover:text-white">${titulo}</h4>
                    </div>
                `;
            });
        }

        function voltarInicio() {
            document.getElementById('input-busca').value = '';
            carregarPaginaInicial();
        }

        function abrirDetalhes(id, tipo) {
            alert(`Abrir detalhes do ID: ${id} (${tipo}) - Aqui você pode plugar seu modal ou player de vídeo!`);
        }
    </script>
</body>
</html>
