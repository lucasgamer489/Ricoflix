<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ricoflix — Dublado PT-BR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { background: #000000; font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif; color: #e0e0e0; min-height: 100vh; background-image: radial-gradient(circle at 20% 30%, rgba(0, 229, 255, 0.03) 0%, transparent 60%), radial-gradient(circle at 80% 70%, rgba(180, 0, 255, 0.04) 0%, transparent 50%); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #00E5FF; border-radius: 20px; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }

        .tab-neon { background: transparent; border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 40px; padding: 0.5rem 1.2rem; font-weight: 500; color: #8899aa; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; font-size: 0.9rem; letter-spacing: 0.3px; position: relative; overflow: hidden; }
        .tab-neon::before { content: ''; position: absolute; inset: 0; border-radius: 40px; padding: 1px; background: linear-gradient(135deg, rgba(0, 229, 255, 0), rgba(180, 0, 255, 0)); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; transition: 0.4s; }
        .tab-neon.active { background: rgba(0, 229, 255, 0.08); border-color: #00E5FF; color: #00E5FF; box-shadow: 0 0 30px rgba(0, 229, 255, 0.08), inset 0 0 30px rgba(0, 229, 255, 0.03); }
        .tab-neon.active::before { background: linear-gradient(135deg, #00E5FF, #b000ff); }
        .tab-neon:hover:not(.active) { border-color: rgba(0, 229, 255, 0.25); color: #c0d0e0; transform: translateY(-1px); }

        .search-cyber { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(0, 229, 255, 0.15); border-radius: 60px; padding: 0.5rem 1.2rem 0.5rem 2.8rem; color: #f0f0f0; width: 260px; transition: all 0.3s; font-size: 0.9rem; letter-spacing: 0.2px; }
        .search-cyber:focus { outline: none; border-color: #00E5FF; box-shadow: 0 0 30px rgba(0, 229, 255, 0.06), inset 0 0 30px rgba(0, 229, 255, 0.02); background: rgba(0, 0, 0, 0.9); }
        .search-cyber::placeholder { color: #556677; font-weight: 300; }

        .card-cyber { width: 200px; background: #080808; border-radius: 24px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.04); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8); flex-shrink: 0; cursor: pointer; }
        .card-cyber::after { content: ''; position: absolute; inset: -1px; border-radius: 24px; padding: 1px; background: linear-gradient(135deg, rgba(0, 229, 255, 0), rgba(180, 0, 255, 0)); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; transition: 0.4s; }
        .card-cyber:hover { transform: translateY(-6px) scale(1.02); border-color: rgba(0, 229, 255, 0.2); box-shadow: 0 12px 50px rgba(0, 229, 255, 0.06), 0 0 80px rgba(0, 229, 255, 0.02); }
        .card-cyber:hover::after { background: linear-gradient(135deg, #00E5FF, #b000ff); opacity: 0.5; }
        .card-cyber .poster-wrapper { position: relative; width: 100%; height: 280px; background: #0a0a0a; overflow: hidden; }
        .card-cyber .poster-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
        .card-cyber .info { padding: 0.9rem 0.9rem 1.1rem; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, #080808 30%); }
        .card-cyber .info h3 { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #eef4ff; letter-spacing: -0.2px; }
        .card-cyber .info .year { font-size: 0.75rem; color: #6688aa; font-weight: 300; letter-spacing: 0.3px; }
        .card-cyber .badge-type { font-size: 0.6rem; background: rgba(0, 229, 255, 0.06); border: 1px solid rgba(0, 229, 255, 0.08); padding: 0.15rem 0.7rem; border-radius: 40px; color: #88ccff; letter-spacing: 0.5px; text-transform: uppercase; }

        .scroll-neon { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 1.2rem; padding: 0.8rem 0.2rem 2rem 0.2rem; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .scroll-neon > * { flex: 0 0 auto; scroll-snap-align: start; }

        #player-container { background: #0a0a0a; border-radius: 28px; overflow: hidden; border: 1px solid rgba(0, 229, 255, 0.08); box-shadow: 0 0 60px rgba(0, 229, 255, 0.02), inset 0 0 60px rgba(0, 229, 255, 0.01); position: relative; min-height: 420px; }
        #player-container::before { content: ''; position: absolute; inset: -1px; border-radius: 28px; padding: 1px; background: linear-gradient(135deg, rgba(0, 229, 255, 0.1), rgba(180, 0, 255, 0.05)); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
        #player-container .plyr { border-radius: 28px; background: #000; }
        #player-container .plyr__video-wrapper { background: #000; }
        #player-container .plyr__controls { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); border-top: 1px solid rgba(0, 229, 255, 0.05); }
        .plyr__control--overlaid { background: rgba(0, 229, 255, 0.15) !important; border: 2px solid rgba(0, 229, 255, 0.3) !important; box-shadow: 0 0 60px rgba(0, 229, 255, 0.1) !important; backdrop-filter: blur(8px); }
        .plyr__control--overlaid svg { fill: #00E5FF !important; }
        .plyr__control--overlaid:hover { background: rgba(0, 229, 255, 0.25) !important; transform: scale(1.05); }
        .plyr__progress__buffer { background: rgba(0, 229, 255, 0.08) !important; }
        .plyr__progress--played, .plyr__progress--buffer { color: #00E5FF !important; }
        .plyr__menu__container .plyr__control[role=menuitemradio][aria-checked=true]::before { background: #00E5FF !important; }

        .loader-neon { border: 2px solid rgba(0, 229, 255, 0.05); border-top: 2px solid #00E5FF; border-radius: 50%; width: 36px; height: 36px; animation: spin 0.9s cubic-bezier(0.6, 0, 0.4, 1) infinite; box-shadow: 0 0 30px rgba(0, 229, 255, 0.05); margin: 2rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .logo-glitch { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, #00E5FF 0%, #b000ff 80%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -0.5px; text-shadow: 0 0 40px rgba(0, 229, 255, 0.08); }

        .btn-neon { background: rgba(0, 229, 255, 0.04); border: 1px solid rgba(0, 229, 255, 0.15); color: #00E5FF; padding: 0.5rem 1.4rem; border-radius: 60px; font-weight: 500; transition: all 0.3s; font-size: 0.85rem; letter-spacing: 0.3px; }
        .btn-neon:hover { background: rgba(0, 229, 255, 0.08); border-color: #00E5FF; box-shadow: 0 0 30px rgba(0, 229, 255, 0.06); transform: scale(1.02); }

        .source-selector { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); border: 1px solid rgba(0, 229, 255, 0.15); border-radius: 40px; padding: 0.4rem 1rem; color: #aabbdd; font-size: 0.8rem; cursor: pointer; transition: 0.3s; min-width: 180px; }
        .source-selector:hover { border-color: rgba(0, 229, 255, 0.3); }
        .source-selector option { background: #0a0a0a; color: #e0e0e0; padding: 0.3rem; }

        .player-title { color: #aabbdd; font-weight: 400; letter-spacing: 0.3px; }
        .player-title strong { color: #00E5FF; font-weight: 600; }

        #episodes-wrapper { background: rgba(10, 10, 10, 0.6); backdrop-filter: blur(8px); border: 1px solid rgba(0, 229, 255, 0.06); border-radius: 20px; padding: 1.2rem; margin-top: 1rem; display: none; max-height: 200px; overflow-y: auto; }
        #episodes-wrapper.active { display: block; }
        #episodes-wrapper .episode-title { color: #00E5FF; font-size: 0.9rem; font-weight: 500; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
        .episode-grid { display: flex; flex-wrap: wrap; gap: 0.6rem; }
        .episode-btn { background: rgba(0, 229, 255, 0.04); border: 1px solid rgba(0, 229, 255, 0.08); border-radius: 30px; padding: 0.4rem 1rem; color: #aabbdd; font-size: 0.75rem; cursor: pointer; transition: all 0.3s; font-weight: 400; letter-spacing: 0.3px; }
        .episode-btn:hover { background: rgba(0, 229, 255, 0.08); border-color: #00E5FF; color: #00E5FF; transform: scale(1.05); }
        .episode-btn.active { background: rgba(0, 229, 255, 0.12); border-color: #00E5FF; color: #00E5FF; box-shadow: 0 0 20px rgba(0, 229, 255, 0.05); }

        .player-error { display: none; background: rgba(255, 0, 0, 0.05); border: 1px solid rgba(255, 0, 0, 0.1); border-radius: 16px; padding: 1.5rem; text-align: center; margin-top: 1rem; color: #ff6b6b; }
        .player-error.visible { display: block; }
        .player-error i { font-size: 2rem; margin-bottom: 0.5rem; display: block; }

        @media (max-width: 640px) {
            .card-cyber { width: 160px; }
            .card-cyber .poster-wrapper { height: 220px; }
            .search-cyber { width: 180px; padding-left: 2.2rem; }
            .logo-glitch { font-size: 1.5rem; }
            .source-selector { min-width: 140px; font-size: 0.7rem; }
        }
    </style>
</head>
<body class="antialiased p-4 md:p-6 max-w-7xl mx-auto">

    <header class="flex flex-wrap items-center justify-between gap-4 mb-6">
        <div class="flex items-center gap-3">
            <span class="logo-glitch">Ricoflix</span>
            <span class="hidden sm:inline text-[10px] text-[#445566] bg-black/60 px-3 py-1 rounded-full border border-[#00E5FF]/10 backdrop-blur-sm">
                <i class="fas fa-language text-[#00E5FF] mr-1"></i> Dublado PT-BR
            </span>
        </div>
        <div class="flex items-center gap-3 flex-wrap">
            <div class="relative">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-[#445566] text-sm"></i>
                <input type="text" id="searchInput" placeholder="Buscar filmes..." class="search-cyber pl-10 pr-4 py-2" />
            </div>
            <button id="searchBtn" class="btn-neon"><i class="fas fa-arrow-right mr-1"></i> Ir</button>
        </div>
    </header>

    <div class="flex flex-wrap items-center gap-3 mb-6 border-b border-[#00E5FF]/5 pb-3">
        <span class="tab-neon active" data-filter="all">📡 Tudo</span>
        <span class="tab-neon" data-filter="movie">🎬 Filmes</span>
        <span class="tab-neon" data-filter="tv">📺 Séries</span>
        <span class="tab-neon" data-filter="continue">⏳ Continuar</span>
        <span class="ml-auto text-[10px] text-[#445566] tracking-widest">
            <i class="fas fa-circle text-[#00E5FF] text-[5px] align-middle mr-1"></i> 4K · HDR · NEON
        </span>
    </div>

    <section class="mb-6">
        <div id="movieGrid" class="scroll-neon"></div>
        <div id="loaderGrid" class="flex justify-center py-8">
            <div class="loader-neon"></div>
        </div>
        <p id="noResults" class="text-center text-[#445566] py-6 hidden">Nenhum título encontrado.</p>
    </section>

    <section id="player-section" class="mt-6">
        <div id="player-container" class="relative">
            <video id="player" playsinline controls></video>
        </div>
        
        <div id="playerError" class="player-error">
            <i class="fas fa-exclamation-triangle"></i>
            <span>Não foi possível carregar o vídeo. Tente outro servidor abaixo.</span>
        </div>
        
        <div class="flex flex-wrap justify-between items-center mt-3 text-sm text-[#556677] px-1 gap-2">
            <span id="movieTitlePlayer" class="player-title"><i class="fas fa-play-circle text-[#00E5FF] mr-2"></i> <strong>Selecione</strong> um filme</span>
            <div class="flex items-center gap-2">
                <span class="text-[10px] text-[#445566]"><i class="fas fa-plug text-[#00E5FF] mr-1"></i> Fonte:</span>
                <select id="sourceSelector" class="source-selector">
                    <option value="redecanais">🔴 RedeCanais (Dublado)</option>
                    <option value="superembed">🟣 SuperEmbed</option>
                    <option value="vidsrc">🟢 VidSrc</option>
                    <option value="2embed">🔵 2Embed</option>
                </select>
            </div>
        </div>

        <div id="episodes-wrapper">
            <div class="episode-title">
                <i class="fas fa-list-ul"></i> 📅 Episódios
                <span id="seasonDisplay" class="text-[#445566] text-xs ml-2">Temporada 1</span>
            </div>
            <div id="episodeGrid" class="episode-grid"></div>
            <div id="episodeLoader" class="flex justify-center py-4" style="display:none;">
                <div class="loader-neon" style="display:block;width:24px;height:24px;"></div>
            </div>
        </div>
    </section>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
    (function() {
        'use strict';

        // ================================================================
        //  CATÁLOGO COM CÓDIGOS REDECANAIS - TODOS DUBLADOS
        // ================================================================
        const CATALOG = [
            // FILMES
            { id: 'sonic3', title: 'Sonic 3', year: '2024', poster: 'https://image.tmdb.org/t/p/w342/d8Ryb8AunYAuycVKDp5HpdWPKgV.jpg', type: 'movie', file: 'STHPRKT03' },
            { id: 'deadpool3', title: 'Deadpool 3', year: '2024', poster: 'https://image.tmdb.org/t/p/w342/8cdWjvZQUDoUYc5uQQj9DmxyiXJ.jpg', type: 'movie', file: 'DPRKT03' },
            { id: 'divertidamente2', title: 'Divertida Mente 2', year: '2024', poster: 'https://image.tmdb.org/t/p/w342/p6H8b1cGfEo9fKbCw8jG0s3nGxM.jpg', type: 'movie', file: 'INSIDEOUT2' },
            { id: 'oppenheimer', title: 'Oppenheimer', year: '2023', poster: 'https://image.tmdb.org/t/p/w342/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg', type: 'movie', file: 'OPPENHEIMER' },
            { id: 'duna2', title: 'Duna: Parte 2', year: '2024', poster: 'https://image.tmdb.org/t/p/w342/8b8R8l88Qje9dn9OE8PY05Nxl1X.jpg', type: 'movie', file: 'DUNA2' },
            { id: 'johnwick4', title: 'John Wick 4', year: '2023', poster: 'https://image.tmdb.org/t/p/w342/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg', type: 'movie', file: 'JWICK4' },
            { id: 'johnwick', title: 'John Wick', year: '2014', poster: 'https://image.tmdb.org/t/p/w342/fZPSd2r4S1M6NdP5p5pK5G5mN5jM.jpg', type: 'movie', file: 'JWICK1' },
            { id: 'johnwick2', title: 'John Wick 2', year: '2017', poster: 'https://image.tmdb.org/t/p/w342/3bN7V5X9nK5D5kF0v5L5h5mN5jM.jpg', type: 'movie', file: 'JWICK2' },
            { id: 'johnwick3', title: 'John Wick 3', year: '2019', poster: 'https://image.tmdb.org/t/p/w342/5Y5WZ7Y8Z9W6X8p8A0zJ2fL.jpg', type: 'movie', file: 'JWICK3' },
            { id: 'godzillaxkong', title: 'Godzilla x Kong', year: '2024', poster: 'https://image.tmdb.org/t/p/w342/z1p34fs7E0nPkH0j3l7M0wZ9qE6.jpg', type: 'movie', file: 'GODZILLAKONG' },
            { id: 'insideout', title: 'Divertida Mente', year: '2015', poster: 'https://image.tmdb.org/t/p/w342/5Y5WZ7Y8Z9W6X8p8A0zJ2fL.jpg', type: 'movie', file: 'INSIDEOUT' },
            { id: 'thor4', title: 'Thor: Amor e Trovão', year: '2022', poster: 'https://image.tmdb.org/t/p/w342/5Y5WZ7Y8Z9W6X8p8A0zJ2fL.jpg', type: 'movie', file: 'THOR4' },
            
            // SÉRIES
            { id: 'lastofus', title: 'The Last of Us', year: '2023', poster: 'https://image.tmdb.org/t/p/w342/uKvVjHNqB5VmOrdxqAt2F7JfEDB.jpg', type: 'tv', file: 'TLOU' },
            { id: 'thebear', title: 'The Bear', year: '2022', poster: 'https://image.tmdb.org/t/p/w342/7H8Hk2W0U8V4K9W6X8p8A0zJ2fL.jpg', type: 'tv', file: 'THEBEAR' },
            { id: 'theboys', title: 'The Boys', year: '2019', poster: 'https://image.tmdb.org/t/p/w342/mC3I0eghP1g5Kb3rWxbB9qkN4sE.jpg', type: 'tv', file: 'THEBOYS' },
            { id: 'succession', title: 'Succession', year: '2018', poster: 'https://image.tmdb.org/t/p/w342/7rTllR2Tx2UMj17HwDfB9TZ67jM.jpg', type: 'tv', file: 'SUCCESSION' },
            { id: 'strangerthings', title: 'Stranger Things', year: '2016', poster: 'https://image.tmdb.org/t/p/w342/49WJfeN0E1p5R0Y2Q8yN1z3X9fA.jpg', type: 'tv', file: 'STRANGERTHINGS' }
        ];

        // ================================================================
        //  SERVIDORES
        // ================================================================
        const PROVIDERS = {
            'redecanais': {
                name: 'RedeCanais',
                movie: (file) => {
                    return `https://cdnv4.ec.cx/RedeCanais/RedeCanais/RCFServer1/ondemand/${file}.mp4`;
                },
                series: (file, season, episode) => {
                    const ep = String(episode).padStart(2, '0');
                    const sea = String(season).padStart(2, '0');
                    return `https://cdnv4.ec.cx/RedeCanais/RedeCanais/RCFServer1/ondemand/${file}S${sea}E${ep}.mp4`;
                }
            },
            'superembed': {
                name: 'SuperEmbed',
                movie: (id) => `https://superembed.stream/movie/${id}`,
                series: (id, season, episode) => `https://superembed.stream/tv/${id}/${season}/${episode}`
            },
            'vidsrc': {
                name: 'VidSrc',
                movie: (id) => `https://vidsrc.xyz/embed/movie/${id}`,
                series: (id, season, episode) => `https://vidsrc.xyz/embed/tv/${id}/${season}/${episode}`
            },
            '2embed': {
                name: '2Embed',
                movie: (id) => `https://www.2embed.cc/embed/${id}`,
                series: (id, season, episode) => `https://www.2embed.cc/embedtv/${id}&s=${season}&e=${episode}`
            }
        };

        // ================================================================
        //  STATE
        // ================================================================
        const appState = {
            currentId: null,
            currentFile: null,
            type: 'movie',
            currentSeason: 1,
            currentEpisode: 1,
            currentTitle: ''
        };

        // ================================================================
        //  DOM
        // ================================================================
        const grid = document.getElementById('movieGrid');
        const loader = document.getElementById('loaderGrid');
        const noResults = document.getElementById('noResults');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const videoElement = document.getElementById('player');
        const movieTitlePlayer = document.getElementById('movieTitlePlayer');
        const sourceSelector = document.getElementById('sourceSelector');
        const episodesWrapper = document.getElementById('episodes-wrapper');
        const episodeGrid = document.getElementById('episodeGrid');
        const episodeLoader = document.getElementById('episodeLoader');
        const seasonDisplay = document.getElementById('seasonDisplay');
        const playerError = document.getElementById('playerError');

        let plyrInstance = null;
        let currentFilter = 'all';

        // ================================================================
        //  PLYR INIT
        // ================================================================
        function initPlyr() {
            if (plyrInstance) {
                plyrInstance.destroy();
            }
            plyrInstance = new Plyr(videoElement, {
                controls: [
                    'play-large', 'play', 'progress', 'current-time', 'duration',
                    'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'
                ],
                settings: ['quality', 'speed'],
                quality: { default: 720, options: [4320, 2160, 1440, 1080, 720, 480, 360] },
                i18n: { quality: 'Qualidade', speed: 'Velocidade' }
            });
        }

        // ================================================================
        //  UPDATE PLAYER
        // ================================================================
        function updatePlayerSource() {
            if (!appState.currentId) {
                videoElement.src = '';
                videoElement.poster = '';
                if (plyrInstance) plyrInstance.stop();
                movieTitlePlayer.innerHTML = `<i class="fas fa-play-circle text-[#00E5FF] mr-2"></i> <strong>Selecione</strong> um filme`;
                playerError.classList.remove('visible');
                return;
            }

            const providerKey = sourceSelector.value;
            const provider = PROVIDERS[providerKey] || PROVIDERS['redecanais'];
            
            const movieData = CATALOG.find(m => m.id === appState.currentId);
            
            let url = '';
            let isRedeCanais = false;

            if (providerKey === 'redecanais' && movieData && movieData.file) {
                isRedeCanais = true;
                if (appState.type === 'tv') {
                    url = provider.series(movieData.file, appState.currentSeason, appState.currentEpisode);
                } else {
                    url = provider.movie(movieData.file);
                }
                
                // Tenta também com o servidor v2 se o v4 falhar
                const urlFallback = url.replace('cdnv4.ec.cx/RedeCanais/RedeCanais/RCFServer1/ondemand', 'cdnv2.ec.cx/RedeCanais/RedeCanais/RCServer01/videos');
                
                // Usa o player HTML5 para RedeCanais
                videoElement.src = url;
                videoElement.type = 'video/mp4';
                videoElement.poster = movieData?.poster || '';
                videoElement.load();
                
                // Se falhar, tenta o fallback
                videoElement.onerror = function() {
                    if (this.src !== urlFallback) {
                        this.src = urlFallback;
                        this.load();
                    } else {
                        playerError.classList.add('visible');
                        movieTitlePlayer.innerHTML = `<i class="fas fa-exclamation-circle text-[#ff6b6b] mr-2"></i> <strong>Erro</strong> — Vídeo não encontrado`;
                    }
                };
                
                if (plyrInstance) {
                    setTimeout(() => plyrInstance.play(), 500);
                }
                
                const typeLabel = appState.type === 'tv' 
                    ? `S${appState.currentSeason}E${appState.currentEpisode}` 
                    : 'Filme';
                movieTitlePlayer.innerHTML = `<i class="fas fa-play-circle text-[#00E5FF] mr-2"></i> <strong>${appState.currentTitle}</strong> <span class="text-[#445566] text-xs ml-2">⚡ ${provider.name} · ${typeLabel} · Dublado</span>`;
                
                document.getElementById('player-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
                return;
            }

            // Para outros provedores, abre em nova aba
            if (!isRedeCanais) {
                if (appState.type === 'tv') {
                    url = provider.series(appState.currentId, appState.currentSeason, appState.currentEpisode);
                } else {
                    url = provider.movie(appState.currentId);
                }
                
                if (url) {
                    window.open(url, '_blank');
                    movieTitlePlayer.innerHTML = `<i class="fas fa-external-link-alt text-[#00E5FF] mr-2"></i> <strong>${appState.currentTitle}</strong> <span class="text-[#445566] text-xs ml-2">⚡ Abrindo ${provider.name}...</span>`;
                }
            }
        }

        // ================================================================
        //  EPISODES
        // ================================================================
        function loadEpisodesLocal(seriesId, seasonNum = 1) {
            episodesWrapper.classList.add('active');
            episodeGrid.innerHTML = '';
            episodeLoader.style.display = 'flex';
            seasonDisplay.textContent = `Temporada ${seasonNum}`;

            const maxEpisodes = {
                'lastofus': 9,
                'thebear': 8,
                'theboys': 8,
                'succession': 10,
                'strangerthings': 9
            };

            const totalEpisodes = maxEpisodes[seriesId] || 10;
            episodeLoader.style.display = 'none';

            for (let i = 1; i <= totalEpisodes; i++) {
                const btn = document.createElement('button');
                btn.className = 'episode-btn';
                if (i === appState.currentEpisode) {
                    btn.classList.add('active');
                }
                btn.textContent = `EP ${i}`;
                
                btn.addEventListener('click', function() {
                    appState.currentEpisode = i;
                    document.querySelectorAll('.episode-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    updatePlayerSource();
                });
                
                episodeGrid.appendChild(btn);
            }
        }

        // ================================================================
        //  RENDER CARDS
        // ================================================================
        function renderMovies(movies) {
            grid.innerHTML = '';
            
            if (!movies || movies.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            movies.forEach(movie => {
                const id = movie.id;
                const title = movie.title;
                const year = movie.year || '2026';
                const posterPath = movie.poster || 'https://via.placeholder.com/342x513/0a0a0a/334455?text=' + encodeURIComponent(title);
                const mediaType = movie.type || 'movie';

                const card = document.createElement('div');
                card.className = 'card-cyber';
                card.setAttribute('data-id', id);
                card.setAttribute('data-type', mediaType);
                card.setAttribute('data-title', title);
                card.setAttribute('data-file', movie.file || '');
                
                card.innerHTML = `
                    <div class="poster-wrapper">
                        <img src="${posterPath}" alt="${title}" loading="lazy" 
                             onerror="this.src='https://via.placeholder.com/342x513/0a0a0a/334455?text=404'" />
                    </div>
                    <div class="info">
                        <div class="flex justify-between items-start">
                            <h3>${title}</h3>
                        </div>
                        <div class="flex justify-between items-center mt-1">
                            <span class="year">${year}</span>
                            <span class="badge-type">${mediaType === 'tv' ? 'Série' : 'Filme'}</span>
                        </div>
                    </div>
                `;
                
                card.addEventListener('click', function() {
                    const movieId = this.getAttribute('data-id');
                    const movieTitle = this.getAttribute('data-title') || 'Título';
                    const mediaType = this.getAttribute('data-type') || 'movie';
                    const file = this.getAttribute('data-file') || '';
                    
                    appState.currentId = movieId;
                    appState.currentFile = file;
                    appState.currentTitle = movieTitle;
                    appState.type = mediaType;
                    appState.currentSeason = 1;
                    appState.currentEpisode = 1;
                    
                    if (mediaType === 'tv') {
                        loadEpisodesLocal(movieId, 1);
                    } else {
                        episodesWrapper.classList.remove('active');
                    }
                    
                    updatePlayerSource();
                });
                
                grid.appendChild(card);
            });
        }

        // ================================================================
        //  FILTERS
        // ================================================================
        function filterCatalog(filter, query = '') {
            let filtered = [...CATALOG];
            
            if (filter === 'movie') {
                filtered = filtered.filter(m => m.type === 'movie');
            } else if (filter === 'tv') {
                filtered = filtered.filter(m => m.type === 'tv');
            }
            
            if (query.trim()) {
                const q = query.toLowerCase();
                filtered = filtered.filter(m => 
                    m.title.toLowerCase().includes(q)
                );
            }
            
            return filtered;
        }

        function loadCatalog(filter = 'all', query = '') {
            const loaderElement = document.querySelector('#loaderGrid .loader-neon');
            if (loaderElement) loaderElement.style.display = 'block';
            
            const movies = filterCatalog(filter, query);
            
            if (loaderElement) loaderElement.style.display = 'none';
            renderMovies(movies);
        }

        function handleFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.tab-neon').forEach(tab => tab.classList.remove('active'));
            const activeTab = document.querySelector(`.tab-neon[data-filter="${filter}"]`);
            if (activeTab) activeTab.classList.add('active');

            if (filter === 'continue') {
                grid.innerHTML = `<div class="text-[#445566] p-6 text-center w-full">⏳ Em breve: sua lista de continuar assistindo.</div>`;
                noResults.classList.add('hidden');
                return;
            }

            searchInput.value = '';
            loadCatalog(filter);
        }

        function performSearch() {
            const query = searchInput.value.trim();
            document.querySelectorAll('.tab-neon').forEach(tab => tab.classList.remove('active'));
            loadCatalog('all', query);
        }

        // ================================================================
        //  SOURCE SELECTOR CHANGE
        // ================================================================
        sourceSelector.addEventListener('change', function() {
            if (appState.currentId) {
                updatePlayerSource();
            }
        });

        // ================================================================
        //  INIT
        // ================================================================
        function init() {
            initPlyr();
            loadCatalog('all');

            document.querySelectorAll('.tab-neon').forEach(tab => {
                tab.addEventListener('click', function() {
                    handleFilter(this.getAttribute('data-filter'));
                });
            });

            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') performSearch();
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
    </script>

    <footer class="mt-12 pt-6 border-t border-[#00E5FF]/5 text-[10px] text-[#334455] flex justify-between items-center">
        <span>© 2026 Ricoflix · Dublado PT-BR</span>
        <span><i class="fas fa-language text-[#00E5FF] mr-1"></i> TODOS OS TÍTULOS DUBLADOS</span>
    </footer>
</body>
