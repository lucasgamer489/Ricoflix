<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricoflix - Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #141414;
            overflow: hidden;
        }
        .player-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="player-container" id="playerWrapper">
        <!-- O iframe será injetado aqui via JavaScript com base no tipo de mídia -->
    </div>

    <script>
        // Função para pegar parâmetros da URL (ex: ?tipo=filme&id=19995 ou ?tipo=serie&id=387&t=1&e=1)
        const params = new URLSearchParams(window.location.search);
        const tipo = params.get('tipo'); // 'filme' ou 'serie'
        const id = params.get('id');     // ID do TMDB
        const temporada = params.get('t') || 1;
        const episodio = params.get('e') || 1;

        const playerWrapper = document.getElementById('playerWrapper');
        let embedUrl = '';

        if (tipo === 'filme' && id) {
            embedUrl = `https://redeflixapi.store/filme/${id}`;
        } else if (tipo === 'serie' && id) {
            embedUrl = `https://redeflixapi.store/serie/${id}/${temporada}/${episodio}`;
        } else {
            embedUrl = 'https://redeflixapi.store/filme/19995'; // fallback padrão
        }

        // Cria e injeta o iframe no documento
        const iframe = document.createElement('iframe');
        iframe.src = embedUrl;
        iframe.setAttribute('allowfullscreen', 'true');
        iframe.setAttribute('webkitallowfullscreen', 'true');
        iframe.setAttribute('mozallowfullscreen', 'true');
        
        playerWrapper.appendChild(iframe);
    </script>

</body>
</html>
