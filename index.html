<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricoflix</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <h1 class="text-2xl font-black text-red-600 tracking-wider">RICOFLIX</h1>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8 flex flex-col gap-6">
        
        <!-- Info do Filme Atual -->
        <div class="flex items-center justify-between">
            <h2 id="movie-title" class="text-xl font-bold">Assistindo a: Sonic 3: O Filme</h2>
            <span class="text-xs bg-zinc-800 text-zinc-400 px-3 py-1 rounded-full">Servidor Dedicado</span>
        </div>

        <!-- Player Container Responsivo (16:9) -->
        <div class="w-full bg-black rounded-xl overflow-hidden shadow-2xl border border-zinc-800">
            <div style="position: relative; width: 100%; height: 0; padding-bottom: 56.25%;">
                <iframe id="main-player" 
                        src="https://v1.watchplay.shop/movie/tt18259086" 
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;" 
                        allowfullscreen="true" 
                        webkitallowfullscreen="true" 
                        mozallowfullscreen="true" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
                </iframe>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-zinc-900 border-t border-zinc-800 text-center py-4 text-xs text-zinc-500">
        Ricoflix &copy; 2026 - Todos os direitos reservados
    </footer>

                type: 'movie',
                video: 'https://v1.watchplay.shop/movie/tt18259086',
                isEmbed: true
            },
            {
                id: 'gumball',
                title: 'O Incrível Mundo de Gumball',
                year: '2011',
                poster: 'https://image.tmdb.org/t/p/w342/t9086TYicYWDB9zXqU4n8T7rQ06.jpg',
                type: 'tv',
                seasons: {
                    1: [
                        { num: 1, title: '1. O Responsável', desc: 'Gumball e Darwin cuidam de Anais...' },
                        { num: 2, title: '2. Laser Vídeo', desc: 'Gumball e Darwin tentam...' }
                    ]
                }
            }
        ];
    </script>
</body>
</html>
