<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricoflix</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-cyan-500 selection:text-zinc-950">

    <!-- Header / Barra Superior -->
    <header class="bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-6">
            <h1 onclick="voltarHome()" class="text-2xl font-black text-cyan-400 tracking-wider cursor-pointer hover:opacity-80 transition-opacity">Ricoflix</h1>
            <span class="text-xs bg-zinc-800 text-cyan-300 px-3 py-1 rounded-full border border-cyan-900/50">Dublado PT-BR</span>
        </div>
        <div class="relative w-72 hidden md:block">
            <input type="text" id="input-busca" onkeypress="buscarNoTmdb(event)" placeholder="Pesquisar (aperte Enter)..." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 text-sm text-zinc-200 focus:outline-none focus:border-cyan-500 transition-colors">
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-6 flex flex-col gap-6">
        
        <!-- Filtros e Navegação -->
        <div id="secao-filtros" class="flex flex-col gap-4">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div class="flex items-center gap-3">
                    <button class="filtro-btn bg-cyan-500 text-zinc-950 font-semibold px-5 py-2 rounded-full text-sm shadow-lg shadow-cyan-500/20">Filmes</button>
                    <button onclick="carregarMinhaLista()" id="btn-minhalista" class="filtro-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-5 py-2 rounded-full text-sm border border-zinc-800 cursor-pointer transition-all">Minha Lista</button>
                </div>
                
                <!-- Barra de busca mobile -->
                <div class="relative w-full md:hidden">
                    <input type="text" id="input-busca-mobile" onkeypress="buscarNoTmdb(event, true)" placeholder="Pesquisar..." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 text-sm text-zinc-200 focus:outline-none focus:border-cyan-500">
                </div>
            </div>

            <!-- Botões de Gêneros -->
            <div id="secao-generos" class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none"></div>
        </div>

        <!-- Grade de Catálogo -->
        <div id="catalogo" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>

        <!-- Seção do Player -->
        <div id="painel-player" class="mt-4 flex flex-col gap-4 hidden animate-fadeIn">
            <div class="flex items-center justify-between flex-wrap gap-3">
                <div class="flex items-center gap-2">
                    <button onclick="voltarHome()" class="text-xs bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-cyan-400 px-3 py-1.5 rounded-lg cursor-pointer transition-all mr-2">&larr; Voltar</button>
                    <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
                    <h2 id="titulo-player" class="text-sm font-semibold text-zinc-300">Assistindo a: -</h2>
                </div>
                
                <!-- Selo de Qualidade Ativo -->
                <div class="flex items-center gap-2">
                    <div id="badge-qualidade" class="text-xs bg-cyan-950 border border-cyan-500/50 text-cyan-400 px-3 py-1 rounded-full font-bold flex items-center gap-1.5 shadow-sm shadow-cyan-500/20">
                        <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span> HD Player Estável
                    </div>
                </div>
            </div>

            <div class="w-full bg-black rounded-xl overflow-hidden shadow-2xl border border-zinc-800" style="aspect-ratio: 16/9; position: relative;">
                <iframe id="meu-player" src="" 
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;" 
                        allowfullscreen="true" 
                        webkitallowfullscreen="true" 
                        mozallowfullscreen="true" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share">
                </iframe>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-zinc-900 border-t border-zinc-800 text-center py-4 text-xs text-zinc-500 mt-12">
        Ricoflix &copy; 2026 - Todos os direitos reservados
    </footer>

    <!-- Script Atualizado sem o selo falso de 4K -->
    <script>
        const API_KEY = '3cbe2c38513cc9d3266f2dc134ce9b29';
        const IMG_BASE_URL = 'https://image.tmdb.org/t/p/w342';

        async function carregarConteudo() {
            voltarHome(false);
            carregarGeneros();

            try {
                const resposta = await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=pt-BR`);
                const dados = await resposta.json();
                exibirCards(dados.results);
            } catch (erro) {
                console.error("Erro ao carregar filmes:", erro);
            }
        }

        async function carregarGeneros() {
            const containerGeneros = document.getElementById('secao-generos');
            containerGeneros.innerHTML = '';
            try {
                const resposta = await fetch(`https://api.themoviedb.org/3/genre/movie/list?api_key=${API_KEY}&language=pt-BR`);
                const dados = await resposta.json();

                containerGeneros.innerHTML = `<button onclick="carregarConteudo()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs px-3 py-1.5 rounded-lg whitespace-nowrap cursor-pointer">Todos</button>`;
                
                dados.genres.forEach(g => {
                    containerGeneros.innerHTML += `<button onclick="filtrarPorGenero(${g.id})" class="bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-400 text-xs px-3 py-1.5 rounded-lg whitespace-nowrap cursor-pointer transition-colors">${g.name}</button>`;
                });
            } catch (e) {
                console.error("Erro gêneros:", e);
            }
        }

        async function filtrarPorGenero(genreId) {
            try {
                const resposta = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&language=pt-BR&with_genres=${genreId}`);
                const dados = await resposta.json();
                exibirCards(dados.results);
            } catch (e) {
                console.error("Erro ao filtrar gênero:", e);
            }
        }

        async function buscarNoTmdb(event, isMobile = false) {
            if (event.key === 'Enter') {
                const inputId = isMobile ? 'input-busca-mobile' : 'input-busca';
                const termo = document.getElementById(inputId).value.trim();
                if (!termo) return;

                try {
                    const resposta = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&language=pt-BR&query=${encodeURIComponent(termo)}`);
                    const dados = await resposta.json();
                    const resultadosValidos = dados.results.filter(item => item.poster_path);
                    
                    if (resultadosValidos.length > 0) {
                        exibirCards(resultadosValidos);
                    } else {
                        alert("Nenhum filme encontrado!");
                    }
                } catch (erro) {
                    console.error("Erro na busca:", erro);
                }
            }
        }

        function obterMinhaLista() {
            return JSON.parse(localStorage.getItem('ricoflix_lista') || '[]');
        }

        function alternarFavorito(event, id, titulo, poster, ano) {
            event.stopPropagation();
            let lista = obterMinhaLista();
            const index = lista.findIndex(item => item.id === id);

            if (index > -1) {
                lista.splice(index, 1);
            } else {
                lista.push({ id, titulo, poster, tipo: 'movie', ano });
            }

            localStorage.setItem('ricoflix_lista', JSON.stringify(lista));
            
            const btn = event.currentTarget;
            btn.classList.toggle('text-cyan-400');
            btn.classList.toggle('text-zinc-400');
        }

        function carregarMinhaLista() {
            document.getElementById('btn-minhalista').className = "filtro-btn bg-cyan-500 text-zinc-950 font-semibold px-5 py-2 rounded-full text-sm shadow-lg shadow-cyan-500/20";
            document.getElementById('secao-generos').innerHTML = '';

            const lista = obterMinhaLista();
            const catalogo = document.getElementById('catalogo');
            catalogo.innerHTML = '';

            if (lista.length === 0) {
                catalogo.innerHTML = '<div class="col-span-full text-center py-12 text-zinc-500 text-sm">Sua lista está vazia. Adicione filmes clicando no ícone de favorito!</div>';
                return;
            }

            lista.forEach(item => {
                let linkPlayer = (item.id == 939243 || item.titulo.toLowerCase().includes('sonic 3')) 
                    ? `https://v1.watchplay.shop/movie/tt18259086` 
                    : `https://fembed.lol/filme/${item.id}/servidor-4`;

                catalogo.innerHTML += `
                    <div onclick="abrirPlayerFilme('${item.titulo.replace(/'/g, "\\'")}', '${linkPlayer}')" class="card-item bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden flex flex-col group cursor-pointer hover:border-cyan-500 transition-all duration-300 hover:shadow-lg hover:shadow-cyan-500/10 relative">
                        <div class="aspect-[2/3] bg-zinc-800 relative overflow-hidden">
                            <img src="${item.poster}" alt="${item.titulo}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
                            <button onclick="alternarFavorito(event, ${item.id}, '${item.titulo.replace(/'/g, "\\'")}', '${item.poster}', '${item.ano}')" class="absolute top-2 left-2 bg-zinc-950/80 p-1.5 rounded-full text-cyan-400 hover:scale-110 transition-transform z-10">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            </button>
                        </div>
                        <div class="p-3 flex flex-col justify-between flex-1">
                            <h3 class="text-sm font-bold text-zinc-200 truncate group-hover:text-cyan-400 transition-colors">${item.titulo}</h3>
                            <div class="flex items-center justify-between text-xs text-zinc-400 mt-2">
                               <span>${item.ano}</span>
                               <span class="text-[10px] bg-zinc-800 px-2 py-0.5 rounded text-zinc-300">Filme</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function exibirCards(filmes) {
            const catalogo = document.getElementById('catalogo');
            catalogo.innerHTML = '';
            const favoritos = obterMinhaLista();

            filmes.forEach(filme => {
                if (!filme.poster_path) return;
                const titulo = filme.title;
                const ano = (filme.release_date || '2026').split('-')[0];
                const poster = IMG_BASE_URL + filme.poster_path;
                const isFavorito = favoritos.some(f => f.id === filme.id);

                let linkPlayer = (filme.id === 939243 || titulo.toLowerCase().includes('sonic 3')) 
                    ? `https://v1.watchplay.shop/movie/tt18259086` 
                    : `https://fembed.lol/filme/${filme.id}/servidor-4`;

                catalogo.innerHTML += `
                    <div onclick="abrirPlayerFilme('${titulo.replace(/'/g, "\\'")}', '${linkPlayer}')" class="card-item bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden flex flex-col group cursor-pointer hover:border-cyan-500 transition-all duration-300 hover:shadow-lg hover:shadow-cyan-500/10 relative">
                        <div class="aspect-[2/3] bg-zinc-800 relative overflow-hidden">
                            <img src="${poster}" alt="${titulo}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
                            <button onclick="alternarFavorito(event, ${filme.id}, '${titulo.replace(/'/g, "\\'")}', '${poster}', '${ano}')" class="absolute top-2 left-2 bg-zinc-950/80 p-1.5 rounded-full ${isFavorito ? 'text-cyan-400' : 'text-zinc-400'} hover:scale-110 transition-transform z-10">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            </button>
                        </div>
                        <div class="p-3 flex flex-col justify-between flex-1">
                            <h3 class="text-sm font-bold text-zinc-200 truncate group-hover:text-cyan-400 transition-colors">${titulo}</h3>
                            <div class="flex items-center justify-between text-xs text-zinc-400 mt-2">
                               <span>${ano}</span>
                               <span class="text-[10px] bg-zinc-800 px-2 py-0.5 rounded text-zinc-300">Filme</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function abrirPlayerFilme(nome, url) {
            document.getElementById('catalogo').classList.add('hidden');
            document.getElementById('secao-filtros').classList.add('hidden');
            document.getElementById('painel-player').classList.remove('hidden');
            document.getElementById('titulo-player').innerText = 'Assistindo a: ' + nome;
            document.getElementById('meu-player').src = url;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function voltarHome(resetarFiltro = true) {
            document.getElementById('painel-player').classList.add('hidden');
            document.getElementById('catalogo').classList.remove('hidden');
            document.getElementById('secao-filtros').classList.remove('hidden');
            document.getElementById('btn-minhalista').className = "filtro-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-5 py-2 rounded-full text-sm border border-zinc-800 cursor-pointer transition-all";
            document.getElementById('meu-player').src = '';
            if(resetarFiltro) carregarConteudo();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        carregarConteudo();
    </script>
</body>
</html>
